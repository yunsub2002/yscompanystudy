  ['👧🆕🏃','그런데 2학기에 전학 온 다은이가 체육 시간에 서윤이를 0.3초 차이로 앞질렀어요. 반 아이들이 웅성거렸어요. “우와, 서윤이보다 빠르다!”'],
  ['👧😤💭','서윤이의 가슴이 쿡 아팠어요. ‘내 자리를 뺏기면 어떡하지?’ 그날부터 서윤이는 다은이와 눈도 마주치지 않았어요.'],
  ['🧑‍🏫📋🏃','선생님이 계주 순서를 발표했어요. “마지막 주자는 다은이, 그 앞 주자는 서윤이!” 서윤이는 입술을 깨물었어요.'],
  ['🏃‍♀️🌇😓','서윤이는 매일 남아서 혼자 운동장을 달렸어요. 그런데 이상하게도 다은이 생각을 할수록 다리가 무거워졌어요.'],
  ['👧🩹🏃','어느 날 서윤이는 운동장 구석에서 혼자 바통 넘기기를 연습하는 다은이를 보았어요. 다은이의 무릎에는 반창고가 여러 개 붙어 있었어요.'],
  ['👧💬👧','“너… 왜 혼자 연습해?” 다은이가 수줍게 웃었어요. “전 학교에서 바통을 떨어뜨려서 우리 반이 졌거든. 그 뒤로 바통 받는 게 너무 무서워.”'],
  ['👧😮💡','서윤이는 깜짝 놀랐어요. 빠르기만 한 줄 알았던 다은이도 무서운 게 있었던 거예요. 서윤이는 처음으로 다은이가 경쟁자가 아니라 친구로 보였어요.'],
  ['👧🤝👧','“같이 연습하자. 내가 바통을 줄게. 너는 손만 뒤로 쭉 뻗어. 내가 ‘하이!’ 하면 잡는 거야.” 둘은 해가 질 때까지 바통을 주고받았어요.'],
  ['🏃‍♀️🏃‍♀️📈','날마다 연습할수록 바통 넘기기가 매끄러워졌어요. 서윤이는 이제 다은이의 기록이 아니라 우리 반의 기록을 생각하며 달렸어요.'],
  ['🏟️🎉🏁','드디어 운동회 날! 응원 소리가 하늘을 찌를 듯했어요. 서윤이네 반은 세 번째로 바통을 이어받았어요.'],
  ['🏃‍♀️💨🔥','서윤이는 바람처럼 달려 두 반을 앞질렀어요. 숨이 턱까지 찼지만, 다은이의 손이 보였어요. “하이!”'],
  ['✋💨✨','바통이 다은이 손에 착 감겼어요. 연습한 그대로였어요. 다은이는 한 번도 뒤돌아보지 않고 결승선을 향해 내달렸어요.'],
  ['🏁🥇😭','결승선! 서윤이네 반이 1등을 했어요. 다은이가 달려와 서윤이를 꽉 안았어요. “고마워. 네가 아니었으면 또 떨어뜨렸을 거야.”'],
  ['👧😊💬','서윤이는 고개를 저었어요. “아니야. 너 덕분에 나도 알았어. 이기는 것보다 함께 달리는 게 더 신난다는 거.”'],
  ['🌇🏃‍♀️🏃‍♀️','그날 저녁, 두 아이는 텅 빈 운동장을 나란히 달렸어요. 누가 더 빠른지는 아무도 세지 않았어요.']],
  quiz:[['서윤이가 다은이를 피한 까닭은?','자기 자리를 빼앗길까 걱정돼서',['다은이가 서윤이를 놀려서','다은이가 전학을 가서'],'😤'],['다은이가 무서워하던 것은?','바통 받기',['넘어지기','큰 소리'],'✋'],['둘이 정한 바통 신호는?','하이!',['출발!','지금!'],'✋'],['서윤이가 깨달은 것은?','이기는 것보다 함께 달리는 게 더 신나요',['혼자 연습하는 게 최고예요','빠른 사람만 중요해요'],'💛']]},
 {id:'bs_court',book:'trial',name:'교실 재판, 사라진 푸딩 사건',ic:'⚖️',ds:'‘우리들의 재판을 시작하겠습니다’ 느낌 · 공정한 재판 배우기',pages:[
  ['🍮🏫😋','금요일 급식 시간, 오늘의 후식은 모두가 기다리던 초코 푸딩이었어요. 그런데 점심을 먹고 돌아온 지민이가 소리쳤어요. “내 푸딩이 없어졌어!”'],
  ['👦❓👉','아이들의 눈길이 한 사람에게 쏠렸어요. 평소 장난이 심한 준수였어요. “준수가 먹었을 거야!” “맞아, 아까 사물함 근처에 있었어!”'],
  ['👦😢🙅','준수는 억울한 얼굴로 고개를 저었어요. “나 아니야! 정말 아니라고!” 교실이 금세 시끄러워졌어요.'],
  ['🧑‍🏫⚖️📢','선생님이 손뼉을 짝짝 쳤어요. “잠깐! 증거도 없이 범인으로 정하면 안 돼요. 오늘은 우리 반 재판을 열어 공정하게 알아봅시다.”'],
  ['🧑‍⚖️👩‍💼👨‍💼','선생님이 역할을 나누어 주었어요. “판사는 재판을 이끌고 판결을 내려요. 검사는 잘못을 밝히려고 증거를 내놓고, 변호사는 피고인의 편에서 억울한 점을 말해요.”'],
  ['👥🗳️🧑‍🤝‍🧑','“배심원 여섯 명은 양쪽 이야기를 모두 듣고 판단해요. 그리고 가장 중요한 원칙! 죄가 증명되기 전까지는 누구도 범인이 아니에요.”'],
  ['👩‍💼📋🔍','검사를 맡은 하은이가 말했어요. “준수는 점심시간에 혼자 교실에 남아 있었습니다. 그리고 입가에 갈색 자국이 있었습니다!”'],
  ['👨‍💼🍫💬','변호사를 맡은 도현이가 일어섰어요. “준수 입가의 자국은 푸딩이 아니라 아침에 먹은 초코 우유 자국입니다. 엄마가 쓴 알림장 메모가 증거입니다.”'],
  ['🧑‍⚖️🤔📝','판사를 맡은 서진이가 말했어요. “준수가 교실에 남았던 이유를 들어 봅시다.” 준수가 말했어요. “당번이라 창문을 닫으러 갔어요.”'],
  ['👧🙋💡','그때 증인으로 나선 소율이가 말했어요. “제가 창문 밖에서 봤는데, 까치 한 마리가 푸딩 뚜껑을 물고 날아갔어요!”'],
  ['🪟🐦🍮','모두 창가로 우르르 몰려갔어요. 창밖 나뭇가지 위 까치 둥지에서 반짝이는 푸딩 컵이 보였어요! 열린 창문 옆 책상에 푸딩이 놓여 있었던 거예요.'],
  ['🧑‍⚖️🔨⚖️','배심원들이 의논한 끝에 판사 서진이가 판결했어요. “증거를 살펴본 결과, 준수는 죄가 없습니다! 범인은… 까치입니다!” 교실에 웃음이 터졌어요.'],
  ['👦😊🙏','아이들은 준수에게 사과했어요. “증거도 없이 의심해서 미안해.” 준수는 멋쩍게 웃었어요. “괜찮아. 재판 덕분에 억울한 게 풀렸어.”'],
  ['🍮🤝👦','지민이는 준수가 자기 푸딩을 반으로 나누어 주어 함께 먹었어요. 세상에서 제일 맛있는 반쪽 푸딩이었어요.'],
  ['🧑‍🏫📜✨','선생님이 칠판에 썼어요. ‘하나, 증거로 판단하기. 둘, 양쪽 말을 모두 듣기. 셋, 소문으로 사람을 판단하지 않기.’'],
  ['⚖️💭❓','공정하다는 건 무엇일까요? 내가 준수였다면 어떤 기분이었을지, 오늘 한번 생각해 보세요.']],
  quiz:[['처음에 아이들은 왜 준수를 의심했나요?','평소 장난이 심하고 교실에 있어서',['푸딩 컵을 들고 있어서','스스로 먹었다고 해서'],'👦'],['피고인의 편에서 억울한 점을 말하는 사람은?','변호사',['검사','판사'],'👨‍💼'],['푸딩을 가져간 진짜 범인은?','까치',['준수','고양이'],'🐦'],['재판에서 가장 중요한 원칙은?','증거로 판단하고 양쪽 말을 모두 듣기',['목소리 큰 사람 말 믿기','소문 믿기'],'⚖️']]}
);

BESTS.g.push(
 {id:'bs_seed',book:'manbok',name:'말 먹는 화분',ic:'🪴',ds:'‘만복이네 떡집’ 느낌 · 말 한마디가 마음을 바꿔요',pages:[
  ['👦😠🗯️','3학년 강우는 입만 열면 퉁명스러운 말이 튀어나왔어요. “저리 비켜.” “그것도 몰라?” 친구들은 하나둘 강우를 피했어요.'],
  ['🏫🪴📦','어느 날 반에 이상한 택배가 도착했어요. 상자 안에는 흙만 담긴 화분 하나와 쪽지가 들어 있었어요. ‘이 화분은 말을 먹고 자랍니다.’'],
  ['🧑‍🏫🪴👦','선생님이 말했어요. “이번 주 화분 당번은 강우! 잘 키워 보렴.” 강우는 투덜거렸어요. “칫, 귀찮게.”'],
  ['🪴🥀😮','그 순간 흙 위로 막 돋아난 새싹이 시들시들 고개를 숙였어요. 강우는 눈을 비볐어요. ‘설마… 내 말을 들은 거야?’'],
  ['👦🤔🪴','강우는 시험 삼아 다른 친구에게 툭 말했어요. “너 그림 진짜 못 그린다.” 그러자 새싹 잎이 누렇게 변했어요.'],
  ['👦😳💬','강우는 깜짝 놀라 얼른 말했어요. “아, 아니… 색칠은 잘했네.” 그러자 누렇던 잎이 살짝 초록빛으로 돌아왔어요.'],
  ['📝👦🌱','그날부터 강우는 몰래 실험을 시작했어요. 공책에 ‘좋은 말’과 ‘나쁜 말’을 적고, 말할 때마다 화분이 어떻게 변하는지 기록했지요.'],
  ['💬🌱📈','“고마워.” 잎이 한 장 났어요. “괜찮아?” 줄기가 쑥 자랐어요. “같이 하자.” 꽃봉오리가 맺혔어요. 좋은 말은 화분의 밥이었어요.'],
  ['👦😅🗯️','하지만 버릇은 쉽게 고쳐지지 않았어요. 피구 시간에 공을 놓친 친구에게 강우가 소리쳤어요. “아, 너 때문에 졌잖아!”'],
  ['🪴🍂😱','교실에 돌아오니 꽃봉오리가 툭 떨어져 있었어요. 강우는 가슴이 철렁했어요. 화분보다 그 친구 얼굴이 더 마음에 걸렸어요.'],
  ['👦🚶🙏','강우는 용기를 내어 친구에게 다가갔어요. “아까는 미안해. 나도 공을 자주 놓치는데, 화부터 냈어.” 친구가 놀란 눈으로 강우를 보다가 웃었어요.'],
  ['🪴🌸✨','다음 날 아침, 화분에 커다란 분홍 꽃 한 송이가 활짝 피어 있었어요. 반 친구들이 모두 모여 “우와!” 하고 감탄했어요.'],
  ['👦👧👦😊','“강우야, 네가 잘 키웠구나!” 친구들의 칭찬에 강우는 귀까지 빨개졌어요. 처음으로 친구들이 강우 곁에 먼저 다가왔어요.'],
  ['🪴🌰📜','꽃이 지고 난 자리에는 씨앗 몇 개가 남았어요. 씨앗 봉투에는 또 쪽지가 있었어요. ‘이제 이 씨앗을 필요한 친구에게 나누어 주세요.’'],
  ['👦🌰🤝','강우는 씨앗 하나를 말수가 적은 짝꿍에게 건넸어요. “같이 키워 볼래? 말을 먹고 자라는 화분이야.”'],
  ['💬🌱💛','말은 마음속 화분에 뿌리는 씨앗이에요. 오늘 여러분은 어떤 말을 심었나요?']],
  quiz:[['화분은 무엇을 먹고 자라나요?','말',['우유','사탕'],'🪴'],['나쁜 말을 하자 화분은 어떻게 되었나요?','새싹이 시들었어요',['꽃이 피었어요','더 크게 자랐어요'],'🥀'],['꽃봉오리가 떨어진 뒤 강우가 한 일은?','친구에게 진심으로 사과했어요',['화분을 버렸어요','다른 반으로 옮겼어요'],'🙏'],['이 이야기가 알려 주는 것은?','고운 말이 나와 친구의 마음을 키워요',['화분은 말을 하지 않아요','말은 아무 힘이 없어요'],'💛']]},
 {id:'bs_kongtteok',book:'kkamnyang',name:'강아지 반장 콩떡이의 해결 일지',ic:'🐶',ds:'‘고양이 해결사 깜냥’ 느낌 · 이웃의 고민을 척척 해결해요',pages:[
  ['🏢🐶📒','행복 아파트 1층 경비실에는 털이 콩고물처럼 노란 강아지 콩떡이가 살았어요. 콩떡이는 스스로를 ‘아파트 반장’이라고 불렀지요. 목에는 작은 수첩이 걸려 있었어요.'],
  ['📒✏️🐶','수첩 첫 장에는 이렇게 쓰여 있었어요. ‘해결 일지 — 고민이 있으면 콩떡이를 부르세요. 단, 간식은 환영!’'],
  ['🏢🔊😫','첫 번째 사건! 302호 할머니가 한숨을 쉬었어요. “위층에서 쿵쿵 소리가 나서 잠을 못 자겠구나.” 콩떡이는 귀를 쫑긋 세우고 402호로 올라갔어요.'],
  ['🧒🧒⚽🏠','402호에는 쌍둥이 형제가 공놀이를 하고 있었어요. “밖에 비가 와서 놀 데가 없어요.” 콩떡이는 곰곰이 생각하다 꼬리를 흔들었어요.'],
  ['🧩🛋️🐶','콩떡이는 쌍둥이에게 거실 바닥에 매트를 깔고 퍼즐 대회를 열자고 했어요. 조용한 놀이였지만 형제는 깔깔 웃으며 즐거워했어요.'],
  ['👵🍪😊','그날 밤 302호 할머니는 푹 잤어요. 다음 날 할머니는 쌍둥이에게 쿠키를 구워 주었고, 쌍둥이는 할머니께 퍼즐을 선물했어요. 해결 완료!'],
  ['🔑❓😰','두 번째 사건! 출근하던 105호 아저씨가 발을 동동 굴렀어요. “열쇠를 잃어버렸어! 회사에 늦겠어!”'],
  ['🐶👃🔍','콩떡이는 코를 킁킁거리며 아저씨가 지나온 길을 따라갔어요. 화단, 자전거 보관소, 우편함… 그리고 놀이터 모래밭에서 멈췄어요.'],
  ['🐾🔑✨','콩떡이가 앞발로 모래를 파자 반짝이는 열쇠가 나왔어요. 아저씨가 아침에 아이와 놀아 주다 떨어뜨린 거였어요. “콩떡아, 고맙다!”'],
  ['🐈😿🌳','세 번째 사건은 조금 어려웠어요. 길고양이 나비가 나무 위에서 내려오지 못하고 울고 있었거든요. 콩떡이는 나무를 오를 수 없었어요.'],
  ['🐶📢👨‍👩‍👧‍👦','“나 혼자서는 안 되겠어!” 콩떡이는 왈왈 짖으며 이웃들을 불러 모았어요. 쌍둥이가 사다리를 가져오고, 105호 아저씨가 올라가고, 할머니가 담요를 펼쳤어요.'],
  ['🐈🤲✨','“조심조심!” 나비가 아저씨 품에 안겨 무사히 내려왔어요. 모두가 박수를 쳤어요. 콩떡이는 그날 일지에 이렇게 썼어요. ‘해결 비법: 혼자 안 될 땐 함께!’'],
  ['📒🐶🤔','그런데 일지의 마지막 장에는 해결하지 못한 고민 하나가 적혀 있었어요. ‘우리 아파트 사람들은 서로 인사를 잘 안 한다.’'],
  ['🎉🏢🐶','콩떡이는 아이디어를 냈어요. 토요일 저녁, 놀이터에서 ‘이웃 간식 파티’를 연 거예요. 할머니의 쿠키, 쌍둥이의 퍼즐, 아저씨의 떡볶이가 모였어요.'],
  ['👋😊🏢','그날 이후 행복 아파트 사람들은 엘리베이터에서 만나면 먼저 인사를 했어요. “안녕하세요!” “콩떡이도 안녕!”'],
  ['📒✅🐶','콩떡이는 일지 마지막 장에 커다랗게 동그라미를 그렸어요. ‘모든 사건 해결 완료. 가장 큰 해결사는 다정한 이웃들!’']],
  quiz:[['콩떡이가 층간 소음을 해결한 방법은?','조용한 퍼즐 놀이를 제안했어요',['크게 짖었어요','공을 숨겼어요'],'🧩'],['잃어버린 열쇠는 어디에 있었나요?','놀이터 모래밭',['우편함 속','화분 밑'],'🔑'],['고양이 나비를 구한 방법은?','이웃들이 힘을 모았어요',['콩떡이가 나무를 탔어요','나비가 혼자 내려왔어요'],'🐈'],['콩떡이가 일지에 쓴 해결 비법은?','혼자 안 될 땐 함께!',['무조건 빨리!','간식이 최고!'],'📒']]},
 {id:'bs_duck',book:'butt',name:'돋보기 탐정 오리 박사',ic:'🔍',ds:'‘엉덩이 탐정’ 느낌 · 단서를 모아 추리해요',pages:[
  ['🦆🔍🎩','꽥꽥 마을에는 돋보기를 든 명탐정 오리 박사가 살았어요. 박사의 말버릇은 “단서는 늘 눈앞에 있지, 꽥!”이었어요.'],
  ['🎂😱🏠','어느 날 곰 할머니의 생일 파티장에서 비명이 울렸어요. “내 꿀 케이크가 사라졌어!” 식탁 위에는 빈 접시만 덩그러니 남아 있었어요.'],
  ['🦆👀🧩','오리 박사가 출동했어요. 파티장에는 손님 세 명이 있었어요. 토끼, 너구리, 그리고 다람쥐. “자, 모두 그 자리에 계세요, 꽥!”'],
  ['🔍🍯🐾','박사는 돋보기로 식탁을 살폈어요. 첫 번째 단서! 식탁보 위에 끈적한 꿀 발자국이 있었어요. 발가락은 다섯 개, 크기는 작았어요.'],
  ['🐰🥕💬','토끼가 말했어요. “저는 당근 케이크만 먹어요. 꿀은 싫어해요.” 토끼의 발은 털이 복슬복슬하고 발가락 자국이 잘 보이지 않았어요.'],
  ['🦝🍽️💬','너구리가 말했어요. “저는 내내 설거지를 했어요. 손이 젖어 있는 게 증거예요!” 정말 너구리 손에서 물이 뚝뚝 떨어졌어요.'],
  ['🐿️😅💬','다람쥐는 볼을 불룩하게 하고 우물우물 말했어요. “저, 저는 아무것도 안 먹었는데요?” 다람쥐 볼에서 달콤한 냄새가 났어요.'],
  ['🔍🌰🌳','두 번째 단서! 창문 밖 나무 아래에 도토리 껍질과 케이크 부스러기가 떨어져 있었어요. 부스러기는 나무 위 구멍까지 이어져 있었어요.'],
  ['🦆🤔💭','박사가 생각했어요. ‘작은 다섯 발가락 자국, 나무 위로 이어진 부스러기, 볼에서 나는 꿀 냄새…’ 여러분도 범인을 짐작했나요?'],
  ['🦆👉🐿️','“범인은 바로… 다람쥐 씨, 당신이에요, 꽥!” 다람쥐가 화들짝 놀라 볼에 숨겨 둔 케이크 조각을 퉤 뱉었어요.'],
  ['🐿️😢🎁','다람쥐가 울먹였어요. “사실은… 할머니 생일 선물을 준비하지 못해서, 케이크를 나무 위 제 집에 옮겨 예쁘게 꾸며서 다시 드리려고 했어요.”'],
  ['🌳🎂✨','모두 나무 위 다람쥐 집으로 올라가 보았어요. 정말로 케이크 위에 도토리와 들꽃이 예쁘게 장식되어 있었어요. 볼 속 조각은 맛을 보다가 그만…'],
  ['🐻😊💛','곰 할머니가 껄껄 웃었어요. “말없이 가져가서 모두 걱정했잖니. 하지만 마음은 고맙구나. 다음엔 꼭 먼저 말해 주렴.”'],
  ['🎉🎂🦆','파티는 나무 아래에서 다시 열렸어요. 도토리로 꾸민 꿀 케이크는 세상에서 가장 특별한 생일 케이크가 되었어요.'],
  ['🦆📝🔍','오리 박사는 수첩에 썼어요. ‘추리의 비법: 하나, 단서를 모두 모은다. 둘, 말과 증거가 맞는지 비교한다. 셋, 왜 그랬는지도 꼭 묻는다.’'],
  ['🔍❓😊','여러분도 탐정이 되어 보세요. 단서는 늘 눈앞에 있으니까요. 꽥!']],
  quiz:[['식탁 위 첫 번째 단서는?','작은 다섯 발가락 꿀 발자국',['당근 조각','젖은 손자국'],'🐾'],['너구리가 내세운 증거는?','젖은 손',['도토리 껍질','꿀 냄새'],'🦝'],['범인은 누구였나요?','다람쥐',['토끼','너구리'],'🐿️'],['다람쥐가 케이크를 가져간 까닭은?','예쁘게 꾸며서 선물하려고',['혼자 다 먹으려고','할머니가 미워서'],'🎁'],['오리 박사의 추리 비법이 아닌 것은?','가장 수상해 보이는 사람을 바로 범인으로 정하기',['단서를 모두 모으기','말과 증거를 비교하기'],'🔍']]},
 {id:'bs_base',book:'treehouse',name:'구름 위 7층 비밀기지',ic:'🏗️',ds:'‘13층 나무 집’ 느낌 · 상상이 쑥쑥 자라는 엉뚱한 기지',pages:[
  ['☁️🏗️👦👧','민호와 수아는 옆집에 사는 단짝이에요. 둘은 커다란 은행나무 꼭대기에서 구름까지 닿는 비밀기지를 짓기로 했어요.'],
  ['📐✏️📝','설계도 첫 장에는 이렇게 쓰여 있었어요. ‘규칙 하나: 한 층에 하나씩, 세상에 없는 방을 만든다. 규칙 둘: 숙제는 꼭 하고 논다.’'],
  ['1️⃣🍋💦','1층은 레모네이드 분수 방! 꼭지를 돌리면 새콤달콤한 레모네이드가 퐁퐁 솟아올랐어요. 단, 너무 많이 마시면 입이 오므라들어요.'],
  ['2️⃣🙃🛋️','2층은 거꾸로 방! 천장에 소파가 붙어 있고 바닥에 전등이 달려 있어요. 이 방에 들어가면 모두 물구나무를 서서 이야기해야 했어요.'],
  ['3️⃣📚🐉','3층은 책 속으로 들어가는 도서관! 공룡 책을 펼치면 아기 공룡이 튀어나와 졸졸 따라다녔어요. 덕분에 공룡 이름을 스무 개나 외웠어요.'],
  ['4️⃣🍕🤖','4층은 로봇 요리사 ‘냠냠봇’의 부엌이에요. 그런데 냠냠봇은 모든 음식에 초콜릿을 넣었어요. 초콜릿 김치, 초콜릿 라면, 초콜릿 된장국까지!'],
  ['5️⃣🔭🪐','5층은 별 보기 전망대! 망원경으로 보면 토성 고리 위에서 외계인이 줄넘기하는 모습이 보였어요. “쟤들도 숙제는 하겠지?”'],
  ['6️⃣🎢😆','6층에서 1층까지는 꼬불꼬불 미끄럼틀로 이어져 있었어요. 내려가는 데 딱 7초! 민호는 초시계로 매일 기록을 쟀어요.'],
  ['💥🏗️😱','그런데 7층을 짓던 날, 둘은 크게 다투었어요. 민호는 게임방을, 수아는 동물 병원을 만들고 싶었거든요. “내 생각이 더 좋아!” “아니거든!”'],
  ['🌬️🌳😨','둘이 싸우는 사이 거센 바람이 불어왔어요. 은행나무가 휘청휘청 흔들리고, 6층 미끄럼틀이 덜컹거렸어요. “기지가 무너지겠어!”'],
  ['👦🤝👧','민호와 수아는 싸움을 멈추고 함께 밧줄을 잡아당겼어요. 한 사람은 기둥을 붙잡고, 한 사람은 밧줄을 묶었어요. 겨우 기지를 지켜 냈어요.'],
  ['😮‍💨💡😊','숨을 고르던 수아가 말했어요. “우리, 둘 다 하면 어때? 동물들이 게임하면서 치료받는 병원!” 민호가 무릎을 탁 쳤어요. “천재다!”'],
  ['7️⃣🐰🎮','그렇게 완성된 7층은 ‘게임 동물 병원’! 감기 걸린 토끼는 퀴즈 게임을 하며 약을 먹고, 다리를 다친 다람쥐는 춤 게임으로 재활 운동을 했어요.'],
  ['📐✏️8️⃣','둘은 설계도 새 장을 펼쳤어요. ‘8층: 다툰 친구가 화해하는 방’. “이건 꼭 필요하겠다.” 둘은 키득키득 웃었어요.'],
  ['☁️🏗️🌟','오늘도 은행나무 꼭대기에서는 망치 소리가 뚝딱뚝딱 들려와요. 비밀기지는 상상만큼 자꾸자꾸 높아지고 있거든요.'],
  ['❓🏗️✏️','여러분이라면 비밀기지 8층에 어떤 방을 만들고 싶나요? 세상에 없는 방을 마음껏 상상해 보세요.']],
  quiz:[['1층은 어떤 방이었나요?','레모네이드 분수 방',['거꾸로 방','별 보기 전망대'],'🍋'],['냠냠봇은 모든 음식에 무엇을 넣었나요?','초콜릿',['소금','고추장'],'🤖'],['기지가 흔들릴 때 둘은 어떻게 했나요?','싸움을 멈추고 힘을 합쳤어요',['각자 집으로 도망갔어요','계속 싸웠어요'],'🤝'],['7층은 결국 어떤 방이 되었나요?','게임 동물 병원',['게임방','수영장'],'7️⃣']]},
 {id:'bs_eagle',book:'wanini',name:'날지 못한 아기 독수리 하늘이',ic:'🦅',ds:'‘푸른 사자 와니니’ 느낌 · 혼자가 된 아이가 자기 길을 찾아요',pages:[
  ['🏔️🪺🦅','높은 바위산 꼭대기 둥지에 아기 독수리 하늘이가 살았어요. 하늘이는 형제들 가운데 몸집이 가장 작고 날개도 가장 짧았어요.'],
  ['🌪️🪺😱','어느 날 거센 돌풍이 몰아쳐 둥지가 흔들렸어요. 아직 날지 못하는 하늘이는 그만 둥지 밖으로 떨어져 깊은 골짜기 아래로 굴러갔어요.'],
  ['🌲🦅😢','정신을 차려 보니 낯선 숲속이었어요. 하늘이는 하늘을 올려다보며 엄마를 불렀지만, 바위산은 너무 높고 멀었어요.'],
  ['🦔🍄💬','덤불 속에서 고슴도치 할머니가 나타났어요. “쯧쯧, 날개가 젖었구나. 날 수 있을 때까지 우리랑 지내자꾸나.”'],
  ['🦅🦔🐇','하늘이는 숲 친구들과 함께 살게 되었어요. 땅을 기어 다니며 산딸기를 찾고, 토끼들과 굴 파기도 해 보았지요. 하지만 늘 마음 한구석이 허전했어요.'],
  ['🐇😄🦅','토끼가 놀렸어요. “독수리가 땅에서 뛰어다니네? 너는 토끼도 아니고 독수리도 아니야!” 하늘이는 고개를 푹 숙였어요.'],
  ['🌙🦅💭','그날 밤 하늘이는 혼자 생각했어요. ‘나는 누구지? 날지도 못하는 독수리는 독수리가 아닌 걸까?’'],
  ['🦔💬💛','고슴도치 할머니가 다가와 말했어요. “남들이 너를 뭐라고 부르든, 너는 너란다. 날지 못하는 오늘의 너도, 날게 될 내일의 너도 모두 하늘이야.”'],
  ['🦅🪨💪','다음 날부터 하늘이는 매일 연습했어요. 바위 위에서 날개를 펴고 뛰어내리기. 처음엔 털썩, 다음엔 휘청, 그다음엔 콩! 몇 번이고 넘어졌어요.'],
  ['🦅👀🌾','연습을 하며 하늘이는 자기만의 재주를 발견했어요. 아주 멀리 있는 것도 또렷하게 보는 눈이었어요. 들판 끝 풀잎 위의 이슬까지 보였지요.'],
  ['🦊⚠️🐇','어느 오후, 하늘이의 눈에 덤불 속에 숨어 토끼 굴로 다가오는 여우가 보였어요. “토끼들아, 피해! 여우가 와!”'],
  ['🐇💨🕳️','하늘이의 외침에 토끼들은 재빨리 굴 속으로 숨었어요. 여우는 빈손으로 돌아갔어요. 토끼가 하늘이에게 다가와 말했어요. “놀려서 미안해. 그리고 고마워.”'],
  ['🌬️🦅✨','계절이 바뀌고 하늘이의 날개는 몰라보게 자랐어요. 어느 바람 부는 아침, 하늘이는 언덕 꼭대기에서 날개를 활짝 펼쳤어요.'],
  ['🦅☁️🌄','바람이 날개 밑으로 쑥 들어오더니 몸이 둥실 떠올랐어요. 하늘이는 숲 위를, 들판 위를, 그리고 구름 위를 날았어요. 아래에서 숲 친구들이 손을 흔들었어요.'],
  ['🏔️🦅💛','멀리 바위산이 보였어요. 하지만 하늘이는 곧장 가지 않고 숲 위를 한 바퀴 크게 돌았어요. 이제 하늘이에게는 돌아갈 곳이 두 군데나 생겼거든요.'],
  ['🦅🌲🌟','하늘이는 지금도 숲 위를 날며 친구들을 지켜 주어요. 남과 달라도, 늦어도 괜찮아요. 넘어지면서 찾은 나만의 길이 가장 높이 나는 길이니까요.']],
  quiz:[['하늘이는 왜 둥지 밖으로 떨어졌나요?','돌풍이 불어서',['형제가 밀어서','먹이를 찾다가'],'🌪️'],['하늘이를 돌봐 준 동물은?','고슴도치 할머니',['여우 아저씨','곰 할아버지'],'🦔'],['하늘이가 발견한 자기만의 재주는?','멀리 있는 것도 또렷하게 보는 눈',['빠르게 땅 파기','큰 소리로 노래하기'],'👀'],['고슴도치 할머니가 알려 준 것은?','남들이 뭐라 하든 나는 나예요',['날지 못하면 독수리가 아니에요','혼자 사는 게 좋아요'],'💛']]}
);
/* ---- 베스트셀러 책장 → 베스트셀러 느낌 창작 동화 탭 ---- */
[['or_button','alsatang'],['or_shop','jeoncheondang'],['or_siblings','heunhan']].forEach(([sid,bid])=>{const s=ORIG.k.concat(ORIG.g).find(x=>x.id===sid);if(s){s.cat='best';s.book=bid}});
BESTS.k.concat(BESTS.g).forEach(s=>{s.type='story';s.cat='best';s.ds=`${s.ds} · ${s.pages.length}쪽`});
BOOKS.k.concat(BOOKS.g).forEach(b=>b.cat='bestinfo');
STORY_CATS.forEach(c=>{if(c[0]==='best')c[1]='베스트셀러 느낌 동화';if(c[0]==='orig')c[1]='창작 학습 동화'});
const _actsOf3=actsOf;actsOf=function(lv,sid){const l=_actsOf3(lv,sid);return sid==='story'?l.concat(BESTS[GR(lv)?'g':'k']):l};
const bookOf=id=>BOOKS.k.concat(BOOKS.g).find(b=>b.id===id);
const _storyView3=storyView;
storyView=function(){_storyView3();const a=curAct();if(!a.book)return;const b=bookOf(a.book);if(!b)return;const last=S.page===a.pages.length-1;if(S.page!==0&&!last)return;
 const t=stage.querySelector('.stext');t.insertAdjacentHTML('beforebegin',`<div class="row" style="justify-content:center"><button class="lbtn" type="button" id="toBook">📚 ${S.page===0?'이 동화가 참고한 책':'진짜 책도 읽어 볼까요?'}: 『${b.name.replace(/\s*\(.*\)/,'')}』 ${b.author}</button></div>`);
 $('#toBook').onclick=()=>{S.auto=false;stopSpeak();S.act=b.id;go('bookinfo')}};
const _bookInfoView3=bookInfoView;
bookInfoView=function(){_bookInfoView3();const a=curAct();const st=actsOf(kid().level,'story').find(x=>x.book===a.id);if(!st)return;
 const box=stage.querySelector('.binfo .row');if(!box)return;box.insertAdjacentHTML('beforeend',`<button class="lbtn on" type="button" id="readSim">📖 이 책 느낌 창작 동화 『${st.name}』 읽기</button>`);
 $('#readSim').onclick=()=>{S.act=st.id;go('story',{page:0,auto:false,showKo:false})}};
const _note3=document.createElement('style');_note3.textContent='.binfo .row{flex-wrap:wrap}';document.head.appendChild(_note3);

render();

</script>
