<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}</style>
<title>꿈나무 놀이학교</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen tablet app — top bar + full-height stage; big tap targets for small hands */
:root{
  --sky:#DDEFFF; --sky2:#C9E5FF; --ink:#22314A; --ink2:#5A6B85; --card:#FFFFFF; --line:#B9D3EE;
  --hangul:#FF7B69; --math:#3E95F2; --eng:#2DB880; --story:#9A78F5; --sun:#FFC531; --sci:#12A4B6; --soc:#F08A24; --ok:#2DB880; --no:#F2546B;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--sky);color:var(--ink);font-family:var(--display);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden;
  background-image:radial-gradient(circle at 12% 18%,#fff8 0 60px,transparent 61px),radial-gradient(circle at 88% 82%,#fff6 0 90px,transparent 91px),radial-gradient(#ffffff55 2px,transparent 2.5px);
  background-size:auto,auto,28px 28px}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;max-width:1400px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:14px;padding-block:12px 8px}
.back{width:58px;height:58px;border-radius:50%;background:var(--card);font-size:30px;box-shadow:0 4px 0 var(--line);display:grid;place-items:center;flex:none}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.ttl{font-size:clamp(22px,3vw,32px);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{font-size:.6em;color:var(--ink2);margin-left:8px}
.pill{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:8px 16px;font-size:22px;box-shadow:0 4px 0 var(--line);flex:none}
.pill .mini{width:36px;height:36px}
.stage{overflow-y:auto;overflow-x:hidden;padding-block:6px 24px;-webkit-overflow-scrolling:touch;position:relative}

/* home */
.hello{text-align:center;font-size:clamp(28px,4.4vw,48px);margin:8px 0 4px;text-wrap:balance}
.sub{text-align:center;color:var(--ink2);font-family:var(--body);font-size:18px;margin-bottom:22px}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;max-width:980px;margin:0 auto}
.kid{background:var(--card);border-radius:32px;padding:22px 22px 26px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 8px 0 var(--line);position:relative}
.kid .face{width:min(190px,40vw);height:min(190px,40vw);animation:bob 3s ease-in-out infinite}
.kid h2{font-size:38px;margin:0}
.badge{font-family:var(--body);font-weight:700;font-size:16px;padding:5px 14px;border-radius:999px;background:var(--sky);color:var(--ink)}
.kid .stats{display:flex;gap:18px;font-size:20px;color:var(--ink2)}
.go{margin-top:8px;background:var(--sun);font-size:28px;padding:14px 44px;border-radius:999px;box-shadow:0 6px 0 #D99A00}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #D99A00}
.edit{position:absolute;top:14px;right:14px;font-family:var(--body);font-size:15px;padding:8px 14px;border-radius:999px;background:var(--sky)}
.foot{display:flex;justify-content:center;gap:12px;margin-top:26px;flex-wrap:wrap}
.chip{font-family:var(--body);font-size:16px;padding:10px 18px;border-radius:999px;background:#ffffffaa}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}

/* subjects */
.greet{display:flex;align-items:center;gap:16px;justify-content:center;margin:4px 0 20px}
.greet .face{width:110px;height:110px;animation:bob 3s ease-in-out infinite}
.bubble{background:var(--card);border-radius:24px;padding:16px 22px;font-size:clamp(22px,3vw,30px);position:relative;box-shadow:0 5px 0 var(--line)}
.bubble::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:16px solid var(--card);border-left:0}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
.subj{border-radius:34px;padding:26px 20px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:230px;justify-content:center;position:relative;overflow:hidden}
.subj .glyph{font-size:76px;line-height:1;text-shadow:0 4px 0 #0002}
.subj .nm{font-size:34px}
.subj .ds{font-family:var(--body);font-size:16px;opacity:.95;text-align:center}
.subj::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:#ffffff22;right:-40px;top:-50px}
.subj:active,.act:active{transform:scale(.97)}
.c-hangul{background:var(--hangul);box-shadow:0 8px 0 #D85646}.c-math{background:var(--math);box-shadow:0 8px 0 #2A72C4}
.c-eng{background:var(--eng);box-shadow:0 8px 0 #1E8C60}.c-story{background:var(--story);box-shadow:0 8px 0 #7351D0}

/* activities */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.act{background:var(--card);border-radius:26px;padding:20px;display:grid;grid-template-columns:76px 1fr;gap:6px 14px;align-items:center;text-align:left;box-shadow:0 6px 0 var(--line);min-height:120px}
.act .ic{grid-row:span 3;width:76px;height:76px;border-radius:22px;display:grid;place-items:center;font-size:40px;color:#fff}
.act .an{font-size:26px}
.act .ad{font-family:var(--body);font-size:15px;color:var(--ink2);line-height:1.4}
.act .ab{font-size:16px;color:#C98A00}
.kind{font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:6px;background:var(--sky);justify-self:start}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:18px;min-height:100%;max-width:1100px;margin:0 auto}
.dots{display:flex;gap:10px;justify-content:center}
.dot{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--line)}
.dot.done{background:var(--sun);box-shadow:none}.dot.now{box-shadow:inset 0 0 0 4px var(--ink)}
.qcard{background:var(--card);border-radius:34px;padding:22px 26px 26px;box-shadow:0 8px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:14px;position:relative}
.qprompt{font-size:clamp(24px,3.2vw,36px);text-align:center;text-wrap:balance;padding:0 70px}
.qvis{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;min-height:60px;font-size:clamp(56px,9vw,104px);line-height:1.1;text-align:center}
.speak{position:absolute;top:16px;right:16px;width:64px;height:64px;border-radius:50%;background:var(--sun);font-size:32px;box-shadow:0 5px 0 #D99A00;display:grid;place-items:center}
.speak:active{transform:translateY(3px);box-shadow:0 2px 0 #D99A00}
.opts{display:grid;gap:16px;grid-template-columns:repeat(var(--n,3),1fr)}
.opt{background:var(--card);border-radius:28px;min-height:130px;padding:14px;font-size:clamp(28px,4.4vw,52px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;box-shadow:0 7px 0 var(--line);transition:transform .1s;text-align:center;word-break:keep-all}
.opt.txt{font-size:clamp(22px,3vw,34px)}
.opt.pic{font-size:clamp(60px,9vw,96px)}
.opt:active{transform:translateY(4px);box-shadow:0 3px 0 var(--line)}
.opt.ok{background:var(--ok);color:#fff;box-shadow:0 7px 0 #1E8C60;animation:pop .4s}
.opt.no{background:#FFE3E7;animation:shake .4s}
.opt.hint{box-shadow:0 0 0 6px var(--sun),0 7px 0 var(--line);animation:pulse 1s infinite}
.buddy{display:flex;align-items:flex-end;gap:10px;margin-top:auto}
.buddy .face{width:96px;height:96px;flex:none}
.buddy .bubble{font-size:24px;padding:12px 18px}
.buddy.cheer .face{animation:jump .6s}
.blank{display:inline-block;min-width:1.6em;border-bottom:5px solid var(--sun);color:var(--sun)}
.sent{font-size:clamp(28px,4vw,46px);font-family:var(--display)}
.grp{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:520px;font-size:clamp(40px,6vw,64px)}
.grpbox{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;font-size:40px;max-width:280px}
.plus{font-size:.6em;color:var(--ink2)}
.tenf{display:grid;grid-template-columns:repeat(5,56px);gap:6px}
.tenf span{width:56px;height:56px;border-radius:12px;background:var(--sky);display:grid;place-items:center;font-size:36px}
.eq{font-size:clamp(52px,8vw,92px);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.swatch{width:1.1em;height:1.1em;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 3px #0001}

/* learn */
.learnbar{display:flex;gap:12px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.lbtn{background:var(--card);border-radius:999px;padding:12px 24px;font-size:22px;box-shadow:0 5px 0 var(--line)}
.lbtn.on{background:var(--ink);color:#fff;box-shadow:0 5px 0 #000}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.lc{background:var(--card);border-radius:24px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 var(--line);min-height:180px;justify-content:center}
.lc .big{font-size:58px;line-height:1.1}
.lc .pic{font-size:44px}
.lc .w{font-size:22px}
.lc .k{font-family:var(--body);font-size:14px;color:var(--ink2)}
.lc.lit{background:var(--sun);transform:scale(1.05);box-shadow:0 6px 0 #D99A00}

/* story */
.reader{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:100%}
.scene{background:linear-gradient(180deg,#FFFFFF 0%,#F1F8FF 100%);border-radius:36px;box-shadow:0 8px 0 var(--line);min-height:min(42vh,340px);display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(70px,12vw,140px);position:relative;overflow:hidden;padding:20px}
.scene .face{width:clamp(110px,16vw,170px);height:auto}
.scene .pg{position:absolute;bottom:14px;right:22px;font-size:18px;color:var(--ink2);font-family:var(--body)}
.stext{background:var(--card);border-radius:28px;padding:22px 28px;font-family:var(--body);font-weight:700;font-size:clamp(22px,2.7vw,30px);line-height:1.7;box-shadow:0 6px 0 var(--line);word-break:keep-all}
.snav{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.snav .lbtn{font-size:24px;padding:14px 30px}
.read{background:var(--story);color:#fff;box-shadow:0 5px 0 #7351D0}
.cover{font-size:46px}

/* result + stickers */
.result{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:10px;text-align:center}
.result .face{width:180px;height:180px;animation:jump 1s ease-in-out 2}
.result h2{font-size:clamp(34px,5vw,54px);margin:0}
.stars{font-size:56px;letter-spacing:6px}
.prize{background:var(--card);border-radius:30px;padding:18px 30px;box-shadow:0 6px 0 var(--line);font-size:24px;display:flex;align-items:center;gap:16px}
.prize b{font-size:72px;font-weight:400;animation:spin 1s}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;max-width:1000px;margin:0 auto}
.slot{aspect-ratio:1;max-width:100%;background:#ffffffaa;border-radius:24px;display:grid;place-items:center;font-size:60px;border:3px dashed var(--line)}
.slot.got{background:var(--card);border:0;box-shadow:0 6px 0 var(--line)}
.slot.got span{animation:pop .5s}

/* modal */
.modal{position:fixed;inset:0;background:#22314A66;display:grid;place-items:center;z-index:50;padding:16px}
.sheet{background:var(--card);border-radius:30px;padding:26px;width:min(560px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:16px}
.sheet h3{margin:0;font-size:30px}
.sheet label{font-family:var(--body);font-weight:700;font-size:16px;color:var(--ink2)}
.sheet input[type=text]{font-family:var(--display);font-size:26px;padding:12px 16px;border-radius:16px;border:3px solid var(--line);width:100%;box-sizing:border-box;color:var(--ink);background:#fff}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.seg button{padding:14px;border-radius:16px;background:var(--sky);font-size:20px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chars button{border-radius:18px;padding:8px 4px;background:var(--sky);display:flex;flex-direction:column;align-items:center;font-size:16px}
.chars button[aria-pressed="true"]{background:var(--sun)}
.chars svg{width:64px;height:64px}
.sheet .go{align-self:stretch;margin-top:4px}
.warn{font-family:var(--body);font-size:15px;color:var(--no);background:none;align-self:center;text-decoration:underline}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:14px;height:20px;border-radius:4px;animation:fall 2.2s linear forwards}

@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes jump{30%{transform:translateY(-22px) scale(1.06)}60%{transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes pulse{50%{transform:scale(1.04)}}
@keyframes spin{from{transform:rotate(-200deg) scale(.2)}to{transform:none}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){
  .opt{min-height:96px}.qprompt{padding:0 56px 0 0;font-size:22px}.speak{width:52px;height:52px;font-size:26px}
  .act{grid-template-columns:60px 1fr}.act .ic{width:60px;height:60px;font-size:30px}
  .tenf{grid-template-columns:repeat(5,40px)}.tenf span{width:40px;height:40px;font-size:26px}
  .pill{font-size:18px;padding:6px 12px}.buddy .face{width:70px;height:70px}
}
.c-sci{background:var(--sci);box-shadow:0 8px 0 #0B7C8A}.c-soc{background:var(--soc);box-shadow:0 8px 0 #C26812}
.lvrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:-6px 0 18px}
.lvrow button{font-family:var(--body);font-weight:700;font-size:15px;padding:8px 14px;border-radius:999px;background:#ffffffaa}
.lvrow button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lvrow span{font-family:var(--body);font-size:14px;color:var(--ink2);align-self:center}
.seg.lv{grid-template-columns:repeat(3,1fr)}
.k-basic{background:#E4F0FF}.k-step{background:#E2F7EC;color:#167A50}.k-drill{background:#FFF0D1;color:#A4630B}.k-think{background:#F0E8FF;color:#6A45C8}.k-read{background:#FFE6E2;color:#B5402F}.k-learn{background:#E4F0FF}.k-story{background:#F0E8FF}
.tabs{display:flex;gap:10px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.meter{display:flex;align-items:center;gap:6px;justify-content:center;font-size:18px;color:var(--ink2)}
.meter i{width:34px;height:12px;border-radius:6px;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.meter i.on{background:var(--eng);box-shadow:none}
.lvup{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--eng);color:#fff;padding:6px 16px;border-radius:999px;font-size:20px;animation:pop .5s}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .08em;font-size:.72em}
.frac b{border-bottom:.08em solid currentColor;padding:0 .18em;font-weight:inherit}
.frac i{font-style:normal;padding:0 .18em}
.passage{font-family:var(--body);font-weight:700;font-size:clamp(17px,2.1vw,23px);line-height:1.75;text-align:left;background:var(--sky);border-radius:20px;padding:16px 20px;max-width:920px;word-break:keep-all}
.opts.one{grid-template-columns:1fr}
.opt.long{font-size:clamp(18px,2.3vw,26px);min-height:76px;font-family:var(--body);font-weight:700}
.qvis .mid{font-size:clamp(26px,3.6vw,40px)}
.drill{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;max-width:1100px;margin:0 auto;align-items:start}
.dpanel{background:var(--card);border-radius:34px;padding:22px;box-shadow:0 8px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;min-height:340px;justify-content:center}
.dtop{display:flex;justify-content:space-between;width:100%;font-size:20px;color:var(--ink2);font-variant-numeric:tabular-nums;position:absolute;top:18px;left:0;padding:0 24px;box-sizing:border-box}
.dprob{font-size:clamp(40px,6vw,74px);font-variant-numeric:tabular-nums;text-align:center;word-break:keep-all}
.dans{min-width:3.2em;padding:6px 18px;border-radius:18px;border:4px solid var(--line);font-size:clamp(40px,6vw,72px);text-align:center;font-variant-numeric:tabular-nums;min-height:1.2em;background:#fff}
.dans.ok{border-color:var(--ok);color:var(--ok)}.dans.no{border-color:var(--no);animation:shake .4s}
.dmsg{font-size:22px;min-height:1.4em;color:var(--ink2)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{background:var(--card);border-radius:22px;font-size:38px;min-height:78px;box-shadow:0 6px 0 var(--line)}
.pad button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.pad .enter{grid-column:span 3;background:var(--sun);box-shadow:0 6px 0 #D99A00;font-size:30px}
.pad button:disabled{opacity:.3}
.report{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:min(640px,100%)}
.report div{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 5px 0 var(--line);font-size:18px;color:var(--ink2)}
.report b{display:block;font-size:34px;color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
.shape-svg text{font-family:var(--display)}
@media (max-width:760px){.drill{grid-template-columns:1fr}.pad button{min-height:64px;font-size:30px}}

.act .an,.act .ad{word-break:keep-all}
.stext.en{font-family:var(--display);font-weight:400}
.entext{font-size:clamp(26px,3.4vw,38px);line-height:1.5;word-break:normal}
.entext.big2{text-align:center}
.entext .w-ok{color:var(--ok)}.entext .w-no{color:var(--no);text-decoration:underline wavy}
.ko{font-family:var(--body);font-weight:700;font-size:clamp(17px,2vw,22px);color:var(--ink2);margin-top:8px;text-align:center}
.spkres{min-height:1.5em;font-family:var(--body);font-weight:700;font-size:20px;text-align:center;line-height:1.6}
.spkstars{font-size:34px;font-family:var(--display)}
.lbtn.mic{background:var(--no);color:#fff;box-shadow:0 5px 0 #C23A4F}
.lbtn.mic.listening{animation:pulse 1s infinite}
.lbtn:disabled{opacity:.5}
.k-phonics{background:#FFF0D1;color:#A4630B}.k-speak{background:#FFE2E8;color:#B5304A}.k-listen{background:#E2F2FF;color:#1D5FA8}.k-write{background:#E8F7DF;color:#3B7A24}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot2{min-width:58px;height:70px;border-radius:16px;border:3px dashed var(--line);display:grid;place-items:center;font-size:42px;padding:0 6px}
.slot2.on{border:3px solid var(--eng);background:#E2F7EC}
.slots.sent .slot2{min-width:90px;height:60px;font-size:28px}
.tiles{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tile{background:var(--card);border-radius:18px;min-width:72px;min-height:72px;font-size:40px;box-shadow:0 6px 0 var(--line);padding:0 10px}
.tiles.sent .tile{font-size:28px;min-height:64px;padding:0 18px}
.tile:disabled{visibility:hidden}
.tile.no{animation:shake .4s;background:#FFE3E7}.tile.hint{box-shadow:0 0 0 6px var(--sun),0 6px 0 var(--line);animation:pulse 1s infinite}

        {q:'위 병아리 이야기에서 엄마 닭은 무엇을 했나요?', vis:'🐥 아기 병아리가 엄마를 찾아 마당을 돌아다녔어요. 그러다 돌부리에 걸려 넘어졌어요. 그때 엄마 닭이 “삐약아!” 하고 불렀어요. 병아리는 엄마 품으로 쏙 들어갔어요.', ans:'“삐약아!” 하고 불렀어요.', wr:['돌부리에 걸려 넘어졌어요.','마당을 돌아다녔어요.'], why:'넘어지고 돌아다닌 것은 병아리가 한 일이에요. 엄마 닭은 병아리를 불렀어요.'},
        {q:'다음 중 차례를 알려 주는 말이 아닌 것은?', ans:'노란', wr:['어느 날','그러자'], why:'‘어느 날’, ‘그러자’는 일이 이어지는 차례를 알려 줘요. ‘노란’은 색깔을 나타내는 말이에요.'},
        {q:'이야기를 읽고 차례대로 늘어놓으세요.', vis:'☔ 비가 내렸어요. 개미는 나뭇잎 아래로 숨었어요. 비가 그치자 하늘에 무지개가 떴어요. 🌈<br><br>㉮ 무지개가 떴어요.<br>㉯ 비가 내렸어요.<br>㉰ 개미가 나뭇잎 아래로 숨었어요.', ans:'㉯ → ㉰ → ㉮', wr:['㉰ → ㉯ → ㉮','㉮ → ㉯ → ㉰'], why:'비가 와서 개미가 숨었고, 비가 그친 뒤 무지개가 떴어요.'},
        {q:'위 개미 이야기에서 개미가 나뭇잎 아래로 숨은 까닭은?', vis:'☔ 비가 내렸어요. 개미는 나뭇잎 아래로 숨었어요. 비가 그치자 하늘에 무지개가 떴어요. 🌈', ans:'비가 내려서', wr:['무지개를 보려고','배가 고파서'], why:'비가 내리자 비를 피하려고 숨었어요.'},
        {q:'이야기의 ‘가운데’ 부분을 고르세요.', vis:'처음: 토끼가 당근 씨앗을 심었어요. 🥕<br>가운데: (        )<br>끝: 커다란 당근을 뽑아 친구들과 나눠 먹었어요.', ans:'날마다 물을 주며 정성껏 길렀어요.', wr:['씨앗을 사러 시장에 갔어요.','당근을 다 먹고 잠을 잤어요.'], why:'씨앗을 심은 뒤 길러야 당근을 뽑을 수 있어요. 그래서 가운데에는 기르는 일이 들어가요.'},
        {q:'차례가 바뀌어 이상한 이야기를 고르세요.', ans:'눈사람이 녹았어요. 그다음 눈사람을 만들었어요.', wr:['눈이 내렸어요. 그다음 눈사람을 만들었어요.','눈사람을 만들었어요. 해가 나자 눈사람이 녹았어요.'], why:'눈사람을 만들어야 녹을 수 있어요. 녹은 다음 만들었다는 것은 차례가 뒤바뀌었어요.'},

        {q:'위 거북 이야기에서 아기 거북은 어떻게 바다로 갔나요?', vis:'🐢 거북이가 바닷가에 알을 낳았어요. 며칠 뒤 알에서 아기 거북들이 나왔어요. 아기 거북들은 엉금엉금 기어 바다로 들어갔어요. 🌊', ans:'엉금엉금 기어서', wr:['깡충깡충 뛰어서','훨훨 날아서'], why:'이야기에 ‘엉금엉금 기어’라고 나와 있어요.'},
        {q:'이야기를 읽고 물음에 답하세요. 가운데에서 일어난 일은?', vis:'처음: 지호는 연을 들고 언덕에 올랐어요. 🪁<br>가운데: 바람이 세게 불어 연이 나뭇가지에 걸렸어요.<br>끝: 아빠가 긴 막대로 연을 내려 주셨어요.', ans:'연이 나뭇가지에 걸렸어요.', wr:['연을 들고 언덕에 올랐어요.','아빠가 연을 내려 주셨어요.'], why:'가운데 부분에 연이 나뭇가지에 걸린 일이 나와요.'},
        {q:'위 지호 이야기에서 연이 나뭇가지에 걸린 까닭은?', vis:'처음: 지호는 연을 들고 언덕에 올랐어요. 🪁<br>가운데: 바람이 세게 불어 연이 나뭇가지에 걸렸어요.<br>끝: 아빠가 긴 막대로 연을 내려 주셨어요.', ans:'바람이 세게 불어서', wr:['아빠가 던져서','비가 와서'], why:'‘바람이 세게 불어’ 연이 나뭇가지에 걸렸다고 나와 있어요.'},
        {q:'네 장면을 차례대로 늘어놓으세요.', vis:'㉮ 애벌레가 번데기가 되었어요.<br>㉯ 나뭇잎 위에 작은 알이 있었어요.<br>㉰ 번데기에서 나비가 나와 날아갔어요. 🦋<br>㉱ 알에서 애벌레가 나와 잎을 먹었어요. 🐛', ans:'㉯ → ㉱ → ㉮ → ㉰', wr:['㉱ → ㉯ → ㉮ → ㉰','㉯ → ㉮ → ㉱ → ㉰'], why:'알 → 애벌레 → 번데기 → 나비의 차례예요.'},

        {q:'이야기를 친구에게 차례대로 들려주는 방법으로 가장 알맞은 것은?', ans:'처음, 가운데, 끝에 일어난 일을 차례대로 말해요.', wr:['가장 재미있는 끝만 말해요.','생각나는 장면부터 아무렇게나 말해요.'], why:'처음부터 끝까지 차례대로 말해야 듣는 친구가 이야기를 잘 이해해요.'}

    { w:4, title:'인물의 마음 알기', goal:'인물이 한 말과 행동을 보고 기쁘다, 속상하다, 설레다 같은 마음을 알맞게 짐작할 수 있어요.',

          {q:'아끼던 장난감이 부서져서 눈물이 났어요. 이때의 마음은?', a:'속상하다', why:'① 아끼던 것이 부서지는 안 좋은 일이 생겼어요. ② 눈물이 날 만큼 마음이 아파요. ③ 이런 마음은 ‘속상하다’예요.'}

        tip:'하루에 한 번 “오늘 기분은 어떤 말로 말할 수 있을까?” 하고 마음 낱말로 말하게 해 보세요. 그림책 인물의 표정을 따라 하며 마음 맞히기 놀이를 하면 재미있어요.'

        {q:'그림의 표정에 어울리는 마음은?', vis:'😢', ans:'슬프다', wr:['신나다','설레다'], why:'눈물을 흘리는 얼굴은 슬픈 마음을 나타내요.'},
        {q:'그림의 표정에 어울리는 마음은?', vis:'😠', ans:'화나다', wr:['기쁘다','부끄럽다'], why:'눈썹을 찌푸리고 입을 꾹 다문 얼굴은 화난 마음이에요.'},

        {q:'따옴표 안의 말과 비슷한 마음을 나타내는 말은?', vis:'놀이공원에 가서 정말 ‘즐거웠어요’.', ans:'신났어요', wr:['슬펐어요','무서웠어요'], why:'‘즐겁다’와 ‘신나다’는 모두 기분이 좋은 마음을 나타내요.'},

 { m:10, title:'바르게 쓰기', goal:'소리와 글자가 다른 낱말과 헷갈리는 받침을 바르게 쓰고, 높임말과 비슷한 말을 알맞게 써요.',
   weeks:[

    { w:4, title:'짧은 영어 글 읽기', goal:'3~4문장으로 된 짧은 영어 글을 듣고 읽으며 내용을 이해해요.',
      lesson:{

        {q:'글을 읽고 답해요. Mia는 어디에 가나요?', vis:'It is sunny today.<br>Mia goes to the park.<br>She can run fast.<br>She is happy.', say:'It is sunny today. Mia goes to the park. She can run fast. She is happy.', ans:'공원', wr:['학교','동물원'], why:'Mia goes to the park. park는 공원이에요.'},

 { m:2, title:'1년 총정리', goal:'1년 동안 배운 파닉스, 낱말, 표현을 다시 정리하고 듣기·읽기로 마무리해요.',
   weeks:[

 for(let i=0;i<d;i++){const a0=(i/d)*2*Math.PI-Math.PI/2,a1=((i+1)/d)*2*Math.PI-Math.PI/2;const x0=100+88*Math.cos(a0),y0=100+88*Math.sin(a0),x1=100+88*Math.cos(a1),y1=100+88*Math.sin(a1);
  s+=`<path d="M100 100 L${x0} ${y0} A88 88 0 ${1/d>.5?1:0} 1 ${x1} ${y1} Z" fill="${i<n?'#FF7B69':'#FFFFFF'}" stroke="#22314A" stroke-width="4"/>`}
 return s+'</svg>'}

 return s+'</svg>'}

const aGcd=A('gcd','quiz','basic','최대공약수','🔗','두 수의 가장 큰 공약수',{one:()=>{const g=R(2,9);let x=R(1,7),y=R(2,9);while(gcd(x,y)!==1||x===y)y=R(2,9);const a=g*x,b=g*y;return mc({prompt:`${Math.min(a,b)}과(와) ${Math.max(a,b)}의 최대공약수는?`,vis:'<div>🔗</div>',say:sayK(`${Math.min(a,b)}와 ${Math.max(a,b)}의 최대공약수는 무엇일까요?`),ans:g,wr:uniq([g*2,g+1,Math.max(1,g-1),lcmOf(a,b)]).filter(v=>v!==g),max:3})}});
const aLcm=A('lcm','quiz','basic','최소공배수','🧮','두 수의 가장 작은 공배수',{one:()=>{const g=R(1,5);let x=R(2,7),y=R(2,9);while(gcd(x,y)!==1||x===y)y=R(2,9);const a=g*x,b=g*y,l=g*x*y;return mc({prompt:`${Math.min(a,b)}과(와) ${Math.max(a,b)}의 최소공배수는?`,vis:'<div>🧮</div>',say:sayK(`${Math.min(a,b)}와 ${Math.max(a,b)}의 최소공배수는 무엇일까요?`),ans:l,wr:uniq([a*b,l+g*x,l*2,Math.max(a,b)]).filter(v=>v!==l),max:3})}});
const aReduce=A('reduce','quiz','basic','약분하기','✂️','기약분수로 나타내기',{one:()=>{const q=R(3,9);let p=R(1,q-1);while(gcd(p,q)!==1)p=R(1,q-1);const k=R(2,6);const ans=`${p}/${q}`;const near=[[p,q+1],[p+1,q],[p*2,q],[p,q*2]].filter(([a,b])=>a<b).map(([a,b])=>frKey(a,b)).filter(x=>x!==ans);return mc({prompt:'기약분수로 나타내면?',vis:`<div class="eq">${frRaw(p*k,q*k)}</div>`,say:sayK(`${frSay(p*k,q*k)}를 기약분수로 나타내 보세요.`),ans,wr:shuffle(near),render:v=>{const [a,b]=v.split('/');return frRaw(a,b)},max:3})}});
const aFracAdd=A('fracadd','quiz','step','분모가 다른 분수','🥧','통분해서 더하고 빼기',{adaptive:true,one:d=>{let b=R(2,6),dd=R(2,d===1?4:8);while(dd===b)dd=R(2,8);const a=R(1,b-1),c=R(1,dd-1);let sub=d>=2&&Math.random()<.5;let n=a*dd+(sub?-1:1)*c*b;if(n<=0){sub=false;n=a*dd+c*b}const den=b*dd;const ans=frKey(n,den);return mc({prompt:'계산해 보세요',vis:`<div class="eq">${frRaw(a,b)} ${sub?'−':'+'} ${frRaw(c,dd)} = ?</div>`,say:sayK(`${frSay(a,b)} ${sub?'빼기':'더하기'} ${frSay(c,dd)}는?`),ans,wr:uniq([sub?frKey(Math.max(1,Math.abs(a-c)),Math.abs(dd-b)||1):frKey(a+c,b+dd),frKey(n+1,den),frKey(n+b,den)]).filter(x=>x!==ans&&!x.endsWith('/0')),render:v=>{const [x,y]=v.split('/').map(Number);return fr(x,y)},max:3})}});
const aArea=A('area','quiz','step','넓이','🟦','직사각형·삼각형·평행사변형',{adaptive:true,one:d=>{const kinds=d===1?['rect']:d===2?['rect','tri','para']:['tri','para','trap'];const k=kinds[R(0,kinds.length-1)];const a=R(3,14),b=R(2,12),c=R(2,Math.max(2,a-1));let ans,wr;if(k==='rect'){ans=a*b;wr=[2*(a+b),a+b]}if(k==='tri'){const bb=a%2?a+1:a;return mc({prompt:'삼각형의 넓이는?',vis:areaSVG('tri',bb,b),say:sayK('삼각형의 넓이는 밑변 곱하기 높이 나누기 2예요.'),ans:`${bb*b/2} cm²`,wr:[`${bb*b} cm²`,`${bb+b} cm²`,`${bb*b/2+b} cm²`],max:3,size:'txt'})}if(k==='para'){ans=a*b;wr=[a*b/2,2*(a+b)]}if(k==='trap'){const s=(a+c)%2?a+c+1:a+c;return mc({prompt:'사다리꼴의 넓이는?',vis:areaSVG('trap',s-c,b,c),say:sayK('사다리꼴의 넓이는 윗변과 아랫변의 합에 높이를 곱하고 2로 나눠요.'),ans:`${s*b/2} cm²`,wr:[`${s*b} cm²`,`${(s-c)*b/2} cm²`,`${s*b/2+b} cm²`],max:3,size:'txt'})}return mc({prompt:{rect:'직사각형',para:'평행사변형'}[k]+'의 넓이는?',vis:areaSVG(k,a,b),say:sayK('넓이를 구해 보세요.'),ans:`${ans} cm²`,wr:[...wr,ans+a].map(v=>`${v} cm²`),max:3,size:'txt'})}});
const aAvg=A('avg','quiz','basic','평균','📊','자료의 값을 고르게',{one:()=>{const n=R(3,5),avg=R(6,30);const k1=R(1,5),k2=R(1,5);const v=shuffle([avg+k1,avg-k1,avg+k2,avg-k2,avg].slice(0,n%2?n:n).slice(0,n));const fix=n*avg-v.reduce((a,b)=>a+b,0);v[0]+=fix;const sum=v.reduce((a,b)=>a+b,0);return mc({prompt:'평균은 얼마일까요?',vis:`<div class="eq" style="font-size:clamp(34px,5vw,56px)">${v.join(', ')}</div>`,say:sayK(`${v.join(', ')}의 평균을 구해 보세요.`),ans:sum/n,wr:[sum,avg+1,avg-1]})}});
const aFracDiv=A('fracdiv','quiz','step','분수의 나눗셈','➗','나누는 분수를 뒤집어 곱해요',{adaptive:true,one:d=>{const b=R(2,9),dd=R(2,9);const a=R(1,b-1),c=R(1,dd-1);const whole=d===1;const A1=whole?R(2,9):a,B1=whole?1:b;const ans=frKey(A1*dd,B1*c);return mc({prompt:'계산해 보세요',vis:`<div class="eq">${whole?A1:frRaw(a,b)} ÷ ${frRaw(c,dd)} = ?</div>`,say:sayK('나누는 분수의 분자와 분모를 바꾸어 곱해 보세요.'),ans,wr:uniq([frKey(A1*c,B1*dd),frKey(B1*c,A1*dd),frKey(A1*dd+1,B1*c)]).filter(x=>x!==ans),render:v=>{const [x,y]=v.split('/').map(Number);return fr(x,y)},max:3})}});
const aRatio=A('ratio','quiz','step','비와 비율','📈','백분율(%) 구하기',{adaptive:true,one:d=>{if(d===1){const tot=pickN([4,5,10,20,25,50],1)[0];const part=R(1,tot-1);const p=part*100/tot;return mc({prompt:`전체 ${tot}명 중 ${part}명은 몇 %일까요?`,vis:'<div>👥</div>',say:sayK(`전체 ${tot}명 중 ${part}명은 몇 퍼센트일까요?`),ans:`${fmt(p)}%`,wr:[`${part}%`,`${fmt(p/10)}%`,`${fmt(100-p)}%`,`${fmt(p+5)}%`],max:3,size:'txt'})}if(d===2){const x=R(1,99);return mc({prompt:`소수 ${fmt(x/100)}를 백분율로 나타내면?`,vis:'<div>💯</div>',say:sayK('소수를 백분율로 바꿔 보세요.'),ans:`${x}%`,wr:[`${fmt(x/10)}%`,`${x*10}%`,`${fmt(x/100)}%`,`${100-x}%`],max:3,size:'txt'})}const a=R(1,8),b=R(a+1,9);return mc({prompt:`비 ${a} : ${b}의 비율을 분수로 나타내면?`,vis:'<div>⚖️</div>',say:sayK(`비 ${a} 대 ${b}의 비율을 분수로 나타내 보세요.`),ans:frKey(a,b),wr:uniq([frKey(b,a),frKey(a,a+b),frKey(b,a+b)]).filter(x=>x!==frKey(a,b)),render:v=>{const [x,y]=v.split('/').map(Number);return fr(x,y)},max:3})}});
const aProp=A('prop','quiz','basic','비례식','🟰','외항의 곱 = 내항의 곱',{one:()=>{let a=R(2,9),b=R(2,9);while(b===a)b=R(2,9);const k=R(2,6);return mc({prompt:'□에 알맞은 수는?',vis:`<div class="eq" style="font-size:clamp(40px,6vw,64px)">${a} : ${b} = ${a*k} : □</div>`,say:sayK(`${a} 대 ${b}는 ${a*k} 대 무엇일까요?`),ans:b*k,wr:[a*k+b,b*k+k,b+k]})}});
const aCircle2=A('circle2','quiz','step','원주와 원의 넓이','🍩','원주율 3.14',{adaptive:true,one:d=>{const r=R(2,10);const area=d>=2&&Math.random()<.6;const ans=area?fmt(3.14*r*r):fmt(3.14*2*r);return mc({prompt:area?`반지름 ${r} cm인 원의 넓이는? (원주율 3.14)`:`반지름 ${r} cm인 원의 원주는? (원주율 3.14)`,vis:'<div>⭕</div>',say:sayK(area?'원의 넓이는 반지름 곱하기 반지름 곱하기 원주율이에요.':'원주는 지름 곱하기 원주율이에요.'),ans:area?`${ans} cm²`:`${ans} cm`,wr:area?[`${fmt(3.14*2*r)} cm²`,`${fmt(3.14*r)} cm²`,`${fmt(3.14*r*r+3.14)} cm²`]:[`${fmt(3.14*r)} cm`,`${fmt(3.14*r*r+1)} cm`,`${fmt(3.14*2*r+3.14)} cm`],max:3,size:'txt'})}});
const aVolume=A('volume','quiz','step','부피와 겉넓이','🧊','직육면체·정육면체',{adaptive:true,one:d=>{const a=R(2,9),b=R(2,9),c=R(2,9);if(d===3){return mc({prompt:`한 모서리가 ${a} cm인 정육면체의 겉넓이는?`,vis:'<div>🎲</div>',say:sayK('정육면체의 겉넓이는 한 면의 넓이 곱하기 6이에요.'),ans:`${6*a*a} cm²`,wr:[`${a*a*a} cm²`,`${4*a*a} cm²`,`${5*a*a} cm²`],max:3,size:'txt'})}return mc({prompt:`가로 ${a} cm, 세로 ${b} cm, 높이 ${c} cm인 직육면체의 부피는?`,vis:'<div>📦</div>',say:sayK('직육면체의 부피는 가로 곱하기 세로 곱하기 높이예요.'),ans:`${a*b*c} cm³`,wr:uniq([`${2*(a*b+b*c+c*a)} cm³`,`${a+b+c} cm³`,`${a*b*c+a*b} cm³`]).filter(x=>x!==`${a*b*c} cm³`),max:3,size:'txt'})}});

const dMixed=D('dmixed','혼합 계산','곱셈·나눗셈 먼저, 괄호 먼저',()=>{const T=R(0,4);let t,a;const x=R(2,9),y=R(2,9),z=R(2,20);if(T===0){t=`${z} + ${x} × ${y}`;a=z+x*y}else if(T===1){const p=x*y;const m=R(1,Math.min(p-1,20));t=`${x} × ${y} − ${m}`;a=p-m}else if(T===2){t=`(${z} + ${x}) × ${y}`;a=(z+x)*y}else if(T===3){t=`${z+20} − ${x*y} ÷ ${x}`;a=z+20-y}else{t=`(${x*y} + ${y*3}) ÷ ${y}`;a=x+3}return{t,a,s:t.replace(/×/g,'곱하기').replace(/÷/g,'나누기').replace(/\+/g,'더하기').replace(/−/g,'빼기')}});
const dDecMul=D('ddecmul','소수의 곱셈','2.4 × 3, 1.5 × 0.4',()=>{const a=R(11,99),b=R(2,9);const two=Math.random()<.5;const A1=a/10,B1=two?b/10:b;return{t:`${fmt(A1)} × ${fmt(B1)}`,a:+fmt(a*b/(two?100:10)),s:`${fmt(A1)} 곱하기 ${fmt(B1)}`}},true);
const dDecDiv=D('ddecdiv','소수의 나눗셈','6.4 ÷ 4 = 1.6',()=>{const b=R(2,9),q=R(11,99);return{t:`${fmt(q*b/10)} ÷ ${b}`,a:+fmt(q/10),s:`${fmt(q*b/10)} 나누기 ${b}`}},true);
const dPct=D('dpct','백분율 계산','80의 25%',()=>{const p=pickN([10,20,25,50,75],1)[0];const B=pickN([20,40,60,80,100,120,200,400],1)[0];return{t:`${B}의 ${p}%`,a:B*p/100,s:`${B}의 ${p}퍼센트`}});

function buildQs(a){
 const n=defN();
 if(a.passages){const out=[];shuffle(a.passages).forEach(p=>p.qs.forEach(q=>{if(out.length<n)out.push(mc({prompt:q[0],vis:`<div class="passage">${p.p}</div>`,say:[[q[0],a.lang]],sayMore:[[p.p,a.lang]],ans:q[1],wr:q[2],sayEn:a.lang==='en-US'}))}));return out}
 if(a.bank)return pickN(a.bank,Math.min(n,a.bank.length)).map(a.toQ);
 return null;
}
function nextGen(){const a=curAct();const seen=S.seen;let q,g=0;do{q=a.one(S.d,S.qi);g++}while(seen.has(String(q.key))&&g<40);seen.add(String(q.key));return q}
function startQuiz(a){const k=kid();const qs=buildQs(a);const d=a.adaptive?(k.step[actKey()]||1):1;
 go('quiz',{qs,n:qs?qs.length:defN(),qi:0,got:0,tries:0,locked:false,d,streak:0,seen:new Set(),q:null,lvup:false});}
function curQ(){if(!S.q)S.q=S.qs?S.qs[S.qi]:nextGen();return S.q}
function quizView(){
 const k=kid(),a=S.storyQuiz?curAct():curAct(),q=curQ();
 setTop(S.storyQuiz?`${a.name} 문제`:a.name,true);
 const n=q.opts.length;const maxLen=Math.max(...q.opts.map(o=>strip(o.label).length));const isPic=q.size==='pic'||q.opts.every(o=>/<svg|swatch|grpbox/.test(o.label));
 const long=!isPic&&maxLen>14,txt=!isPic&&maxLen>4;
 const cols=long?1:(window.innerWidth<640&&n===4?2:n);
 stage.innerHTML=`<div class="quiz">
 <div class="dots">${Array.from({length:S.n},(_,i)=>`<span class="dot ${i<S.qi?'done':''} ${i===S.qi?'now':''}"></span>`).join('')}</div>
 ${a.adaptive&&!S.storyQuiz?`<div class="meter">단계 ${[1,2,3].map(i=>`<i class="${i<=S.d?'on':''}"></i>`).join('')}</div>`:''}
 <div class="qcard">${S.lvup?'<span class="lvup">단계 UP! 🚀</span>':''}<button class="speak" type="button" id="spk" aria-label="다시 듣기">🔊</button><div class="qprompt">${q.prompt}</div>${q.vis?`<div class="qvis">${q.vis}</div>`:''}</div>
 <div class="opts ${long?'one':''}" style="--n:${cols}">${q.opts.map((o,i)=>`<button class="opt ${isPic?'pic':long?'txt long':txt?'txt':''}" type="button" data-o="${i}">${o.label}</button>`).join('')}</div>
 <div class="buddy" id="buddy">${charSvg(k)}<div class="bubble" id="bb">${S.qi===0?'같이 풀어 보자!':'다음 문제야!'}</div></div></div>`;
 S.lvup=false;
 $('#spk').onclick=()=>sayList((q.sayMore||[]).concat(q.say,S.tries&&q.hintSay?q.hintSay:[]));
 sayList(q.say);
 stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickOpt(b,q));
}
function pickOpt(b,q){
 if(S.locked)return;const a=curAct();const o=q.opts[+b.dataset.o];const bb=$('#bb'),bd=$('#buddy');
 if(o.v===q.answer){
  S.locked=true;b.classList.add('ok');sndOk();
  if(S.tries===0){S.got++;S.streak++;if(a.adaptive&&!S.storyQuiz&&S.streak>=2&&S.d<3){S.d++;S.streak=0;S.lvup=true}}
  const p=PRAISE[R(0,PRAISE.length-1)];bb.textContent=p;bd.classList.remove('cheer');void bd.offsetWidth;bd.classList.add('cheer');
  const seq=[[p,'ko-KR']];if(o.sayEn)seq.unshift([o.sayEn,'en-US']);if(q.after)seq.push(...q.after);sayList(seq);
  setTimeout(()=>{if(S.view!=='quiz')return;S.qi++;S.tries=0;S.locked=false;S.q=null;if(S.qi>=S.n)finishQuiz();else render()},q.after?2300:1700);
 }else{
  b.classList.remove('no');void b.offsetWidth;b.classList.add('no');sndNo();S.tries++;S.streak=0;
  if(S.tries===1&&a.adaptive&&!S.storyQuiz&&S.d>1){S.d--}
  const r=RETRY[R(0,RETRY.length-1)];bb.textContent=r;sayList([[r,'ko-KR']].concat(q.hintSay||[]));
  if(S.tries>=2){const idx=q.opts.findIndex(x=>x.v===q.answer);stage.querySelectorAll('.opt')[idx].classList.add('hint');if(q.script&&!$('#script')){const d=document.createElement('div');d.id='script';d.className='passage';d.innerHTML='📜 '+q.script;$('.qcard').appendChild(d)}}
 }
}
function award(){const k=kid();const pool=STICKERS.filter(x=>!k.stickers.includes(x));const src=pool.length?pool:STICKERS;const st=src[R(0,src.length-1)];if(!k.stickers.includes(st))k.stickers.push(st);return st}
function finishQuiz(){
 const k=kid(),a=curAct();k.stars+=S.got;const key=actKey();k.best[key]=Math.max(k.best[key]||0,S.got);
 if(a.adaptive&&!S.storyQuiz)k.step[key]=S.d;
 const st=award();save();S.res={kind:'quiz',got:S.got,total:S.n,st,d:a.adaptive&&!S.storyQuiz?S.d:0};go('result');
}

function startDrill(a){const list=[],seen=new Set();let g=0;while(list.length<a.n&&g++<200){const p=a.one();if(seen.has(p.t))continue;seen.add(p.t);list.push(p)}

function drillView(){
 const a=curAct(),dr=S.dr,p=dr.list[dr.i];setTop(a.name,true);
 stage.innerHTML=`<div class="drill"><div class="dpanel"><div class="dtop"><span>${dr.i+1} / ${dr.list.length}</span><span id="clock">⏱ ${mmss(Date.now()-dr.t0)}</span></div>
  <div class="dprob">${p.t} =</div><div class="dans" id="dans">${dr.input||'&nbsp;'}</div><div class="dmsg" id="dmsg">${dr.wrong?'다시 계산해 봐요!':'답을 눌러 입력하세요'}</div>
  <button class="lbtn" type="button" id="dsay">🔊 문제 듣기</button></div>
  <div class="pad">${['7','8','9','4','5','6','1','2','3',a.dot?'.':'','0','⌫'].map(x=>`<button type="button" data-k="${x}" ${x===''?'disabled':''}>${x}</button>`).join('')}<button class="enter" type="button" data-k="ok">확인</button></div></div>`;
 clearInterval(S.timer);S.timer=setInterval(()=>{const c=$('#clock');if(c&&S.view==='drill')c.textContent='⏱ '+mmss(Date.now()-dr.t0);else clearInterval(S.timer)},500);
 $('#dsay').onclick=()=>say(p.s+'는?');
 stage.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>drillKey(b.dataset.k));
}
function drillKey(k){
 const dr=S.dr;if(!dr||S.view!=='drill'||dr.lock)return;const p=dr.list[dr.i];const box=$('#dans');
 if(k==='⌫'){dr.input=dr.input.slice(0,-1)}else if(k==='ok'){
  if(!dr.input)return;
  if(Math.abs(parseFloat(dr.input)-p.a)<1e-9){if(!dr.wrong)dr.ok++;box.classList.add('ok');sndOk();dr.lock=true;setTimeout(()=>{dr.lock=false;dr.i++;dr.input='';dr.wrong=0;if(dr.i>=dr.list.length)finishDrill();else drillView()},450);return}
  dr.wrong++;sndNo();box.classList.remove('no');void box.offsetWidth;box.classList.add('no');
  if(dr.wrong>=2){dr.miss.push(`${p.t} = ${fmt(p.a)}`);$('#dmsg').textContent=`정답은 ${fmt(p.a)} 이에요`;say(`정답은 ${fmt(p.a)}이에요.`);dr.lock=true;setTimeout(()=>{dr.lock=false;dr.i++;dr.input='';dr.wrong=0;if(dr.i>=dr.list.length)finishDrill();else drillView()},1800);return}
  dr.input='';$('#dmsg').textContent='다시 계산해 봐요!';
 }else{if(dr.input.length>=8)return;if(k==='.'&&dr.input.includes('.'))return;dr.input+=(k==='.'&&!dr.input?'0':'')+k}
 box.innerHTML=dr.input||'&nbsp;';
}
document.addEventListener('keydown',e=>{if(S.view!=='drill')return;if(/^[0-9.]$/.test(e.key))drillKey(e.key);else if(e.key==='Backspace')drillKey('⌫');else if(e.key==='Enter')drillKey('ok')});
function finishDrill(){clearInterval(S.timer);const k=kid(),dr=S.dr,t=Date.now()-dr.t0,key=actKey();const prev=k.drill[key];
 const better=!prev||dr.ok>prev.s||(dr.ok===prev.s&&t<prev.t);if(better)k.drill[key]={s:dr.ok,n:dr.list.length,t};k.stars+=dr.ok;const st=award();save();
 S.res={kind:'drill',got:dr.ok,total:dr.list.length,t,best:k.drill[key],newBest:better&&!!prev,st,miss:dr.miss};go('result')}

function resultView(){

/* ============ 말하기 인식 (기기 지원 시) ============ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let micOK=!!SR;
const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const CONTR={"i'm":'i am',"it's":'it is',"don't":'do not',"can't":'cannot',"i'll":'i will',"what's":'what is',"let's":'let us',"that's":'that is',"he's":'he is',"she's":'she is',"you're":'you are',"we're":'we are',"they're":'they are',"isn't":'is not',"how's":'how is',"doesn't":'does not',"mcgregor's":'mcgregor'};
function normWords(t){return t.toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z0-9' -]/g,' ').split(/[\s-]+/).filter(Boolean).flatMap(w=>{if(CONTR[w])return CONTR[w].split(' ');if(/^\d+$/.test(w)&&+w<=20)return [NUMW[+w]];return [w.replace(/'/g,'')]}).map(w=>w==='cannot'?'can':w).filter(w=>w!=='not'||true)}
function scoreSpeech(target,heard){const T=normWords(target),H=normWords(heard);const pool=[...H];const hit=T.map(w=>{const i=pool.indexOf(w);if(i>=0){pool.splice(i,1);return true}return false});return{pct:T.length?Math.round(100*hit.filter(Boolean).length/T.length):0,hit}}
function listenOnce(onPartial,onDone){
 let done=false;const fin=(txt,err)=>{if(done)return;done=true;onDone(txt,err)};
 try{const r=new SR();r.lang=store.enVoice||'en-US';r.interimResults=true;r.maxAlternatives=3;r.continuous=false;let best='';
  r.onresult=e=>{best=Array.from(e.results).map(x=>x[0].transcript).join(' ');onPartial(best)};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture')micOK=false;fin(best,e.error)};
  r.onend=()=>fin(best);stopSpeak();r.start();setTimeout(()=>{try{r.stop()}catch(e){}},9000);return r}catch(e){micOK=false;fin('', 'start')}
}
/* 공통 녹음 버튼 동작: box=결과 표시, btn=버튼, wordsEl=단어 색칠할 곳 */
function tryRecord(target,box,btn,wordsEl,onScore){
 const paint=hit=>{if(!wordsEl)return;const spans=wordsEl.querySelectorAll('[data-w]');const T=normWords(target);let ti=0;spans.forEach(sp=>{const n=normWords(sp.textContent).length;const ok=hit.slice(ti,ti+n).every(Boolean);sp.className=n?(ok?'w-ok':'w-no'):'';ti+=n})};
 if(SR&&micOK){btn.disabled=true;btn.classList.add('listening');box.innerHTML='🎙️ 듣고 있어요… 지금 말해 보세요!';
  listenOnce(t=>{box.innerHTML='🎙️ '+esc(t)},(t,err)=>{btn.disabled=false;btn.classList.remove('listening');
   if(!t){if(!micOK){box.innerHTML='마이크를 쓸 수 없어서 <b>스스로 확인 모드</b>로 바꿨어요. 다시 눌러 주세요.';return}box.innerHTML='잘 안 들렸어요. 조금 더 크게 말해 볼까요?';return}
   const r=scoreSpeech(target,t);paint(r.hit);const st=r.pct>=85?3:r.pct>=55?2:1;
   const msg=st===3?'Excellent! 발음 최고예요!':st===2?'Good job! 조금만 더!':'Nice try! 다시 해 볼까?';
   box.innerHTML=`<div class="spkstars">${'⭐'.repeat(st)}<span style="opacity:.25">${'⭐'.repeat(3-st)}</span> <b>${r.pct}점</b></div><div>들린 말: “${esc(t)}”</div><div>${msg}</div>`;
   st>=2?sndOk():sndNo();sayList([[msg.split('!')[0]+'!','en-US']]);onScore&&onScore(st)})}
 else{let n=3;btn.disabled=true;box.innerHTML=`🗣️ 따라 말해 보세요! <b>${n}</b>`;const iv=setInterval(()=>{n--;if(n>0){box.innerHTML=`🗣️ 따라 말해 보세요! <b>${n}</b>`;return}clearInterval(iv);btn.disabled=false;
   box.innerHTML=`<div>잘 말했나요? 스스로(또는 부모님이) 골라 주세요.</div><div class="row" style="margin-top:8px"><button class="lbtn" type="button" data-self="3">😀 또박또박 잘했어요</button><button class="lbtn" type="button" data-self="2">🙂 조금 어려웠어요</button><button class="lbtn" type="button" data-self="0">🔁 다시 할래요</button></div>`;
   box.querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>{const st=+b.dataset.self;if(!st){box.innerHTML='';sayList([[target,'en-US']]);return}box.innerHTML=`<div class="spkstars">${'⭐'.repeat(st)}</div>`;sndOk();onScore&&onScore(st)})},900)}
}

/* ============ 쓰기: 단어 만들기 / 문장 만들기 ============ */
function startBuild(a){const items=pickN(a.items(),Math.min(a.n||6,a.items().length));stopSpeak();clearInterval(S.timer);Object.assign(S,{view:'build',bd:{items,i:0,got:0}});setupBuild();stage.scrollTop=0}
function setupBuild(){const a=curAct(),bd=S.bd,it=bd.items[bd.i];const sent=a.mode==='sent';
 const tokens=sent?it.slice():[...it[0].toLowerCase()];const extraN=sent?0:Math.min(3,Math.max(1,Math.floor(tokens.length/2)));
 const letters='abcdefghijklmnoprstuwy'.split('').filter(c=>!tokens.includes(c));const extra=sent?[]:pickN(letters,extraN);
 let tiles=shuffle(tokens.concat(extra).map((t,i)=>({t,id:i})));if(sent&&tiles.map(x=>x.t).join(' ')===tokens.join(' '))tiles=tiles.reverse();
 Object.assign(bd,{tokens,tiles,pos:0,miss:0,used:{},text:sent?it.join(' '):it[0],pic:sent?'':it[1]});render()}
function buildView(){
 const a=curAct(),bd=S.bd,k=kid(),sent=a.mode==='sent';setTop(a.name,true);
 stage.innerHTML=`<div class="quiz"><div class="dots">${bd.items.map((_,i)=>`<span class="dot ${i<bd.i?'done':''} ${i===bd.i?'now':''}"></span>`).join('')}</div>

/* ---- 학습지 구성 ---- */
function prevWeek(m,w){if(w>1)return[m,w-1];const i=MORDER.indexOf(m);return i>0?[MORDER[i-1],4]:null}
function probRef(ref){const [s,m,w,i]=ref.split('.');const wk=wbW(s,+m,+w);return wk&&wk.probs[+i]}
function mkItem(ref,r,tag){const p=probRef(ref);return{ref,p,tag,opts:sshuf([p.ans,...p.wr].map(String),r)}}
function buildSheet(s,m,w,d){
 const key=`${s}.${m}.${w}.${d}`,r=rng(key+'#v1'),items=[];let drill=[];
 const refsOf=(mm,ww)=>wbW(s,mm,ww).probs.map((_,i)=>`${s}.${mm}.${ww}.${i}`);
 let title,lesson=null,kind;
 if(d==='M'){kind='월말 평가';title=`${m}월 월말 평가`;
  [1,2,3,4].forEach(ww=>sshuf(refsOf(m,ww),r).slice(0,4).forEach(ref=>items.push(mkItem(ref,r))));
  if(s==='math'){const ks=[1,2,3,4].map(ww=>wbW(s,m,ww).drill);for(let i=0;i<10;i++)drill.push(DRG[ks[i%4]](r))}
 }else{const wk=wbW(s,m,w);
  if(d<=4){kind=`${d}일차`;lesson=wk;const all=refsOf(m,w),q=Math.ceil(all.length/4);all.slice((d-1)*q,d*q).forEach(ref=>items.push(mkItem(ref,r)));
   if(d>=2){const pw=prevWeek(m,w);const pool=pw?refsOf(...pw):[];if(d>=3)pool.push(...refsOf(m,w).slice(0,(d-1)*q));const pick=sshuf(pool,r).slice(0,d===4?2:1);pick.forEach(ref=>items.push(mkItem(ref,r,'누적 복습')))}
  }else{kind='주간 평가';sshuf(refsOf(m,w),r).slice(0,10).forEach(ref=>items.push(mkItem(ref,r)))}
  title=`${m}월 ${w}주 ${kind} · ${wk.title}`;
  if(s==='math'){const seen=new Set();let g=0;while(drill.length<10&&g++<200){const it=DRG[wk.drill](r);if(seen.has(it.t))continue;seen.add(it.t);drill.push(it)}}
 }
 return{key,s,m,w,d,kind,title,lesson,items,drill,pick:{},din:{},graded:false};
}
function buildWrongSheet(s){const k=kid();const refs=((k.wrong||{})[s]||[]).filter(probRef).slice(0,10);const r=rng('w'+Date.now());
 return{key:null,s,kind:'오답 노트',title:`${WBN[s][1]} 오답 노트 다시 풀기`,lesson:null,items:refs.map(ref=>mkItem(ref,r)),drill:[],pick:{},din:{},graded:false,wrongMode:true}}

/* ---- 기록 ---- */
const wbRec=k=>(k.wb=k.wb||{});
const wbDone=(k,s,m,w,d)=>wbRec(k)[`${s}.${m}.${w}.${d}`];
const dayDone=(k,m,w,d)=>WBS.every(([s])=>wbDone(k,s,m,w,d));
function nextDay(k){const st=MORDER.indexOf(k.wbStart||3);for(const m of MORDER.slice(st).concat(MORDER.slice(0,st)))for(let w=1;w<=4;w++)for(let d=1;d<=5;d++)if(!dayDone(k,m,w,d))return{m,w,d};return null}
const calMonth=()=>new Date().getMonth()+1;
function wbStats(k){const rec=wbRec(k);const v=Object.values(rec);const days=MORDER.reduce((a,m)=>a+[1,2,3,4].reduce((b,w)=>b+[1,2,3,4,5].filter(d=>dayDone(k,m,w,d)).length,0),0);

  ['🐳✉️🗼','“멀리 사는 친구야, 너의 노래가 바람을 타고 들려와. 덕분에 밤마다 잠이 잘 와. — 등대 아저씨가”'],
  ['🐳🎵🌊','고래는 기분이 좋아 “우우웅” 하고 긴 노래를 불렀어요. 노래는 파도를 타고 멀리멀리 퍼져 나갔어요.'],
  ['🐰☁️🏙️','세 번째 편지는 도시의 작은 아파트로 가는 편지였어요. 토토는 구름을 징검다리 삼아 폴짝폴짝 내려갔어요.'],
  ['🪟🧒😟','창문 너머 아이 하나가 잠들지 못하고 뒤척이고 있었어요. “내일 학예회에서 실수하면 어떡하지?”'],
  ['🐰✉️🪟','토토가 창문 틈으로 편지를 쏙 밀어 넣었어요. 아이는 침대에서 일어나 조심조심 봉투를 열었어요.'],
  ['💌✨🌙','“실수해도 괜찮아. 연습한 너의 마음은 이미 반짝이고 있어. 무대에서 엄마 아빠 얼굴을 찾아봐. — 너를 응원하는 달님이”'],
  ['🧒😌🛏️','아이는 편지를 가슴에 꼭 안았어요. 걱정으로 콩닥대던 마음이 잔잔한 호수처럼 고요해졌어요.'],
  ['🐰🎒🌙','가방이 텅 비자 토토는 달님 마을로 돌아왔어요. 그런데 가방 맨 아래에 아직 편지 한 통이 남아 있었어요.'],
  ['✉️🐰❓','봉투에는 ‘토토에게’라고 쓰여 있었어요. “어? 나한테 온 편지라고?” 토토의 긴 귀가 쫑긋 섰어요.'],
  ['🌙💛🐰','“밤마다 모두에게 다정한 마음을 배달해 줘서 고마워. 오늘은 네가 푹 쉬렴. — 달님이”'],
  ['🐰💤⭐','토토는 편지를 베개 밑에 넣고 스르르 눈을 감았어요. 오늘 밤 여러분의 꿈속에도 다정한 편지가 도착할 거예요. 잘 자요.']],
  quiz:[['토토는 무슨 일을 하나요?','밤마다 편지를 배달해요',['빵을 구워요','별을 닦아요'],'✉️'],['고래에게 편지를 보낸 것은 누구인가요?','등대 아저씨',['아기 다람쥐','부엉이 할아버지'],'🐳'],['잠 못 들던 아이는 무엇을 걱정했나요?','학예회에서 실수할까 봐',['숙제를 못 해서','강아지가 아파서'],'🧒'],['마지막 편지는 누구에게 온 편지였나요?','토토',['부엉이 할아버지','고래'],'🐰']]}
],
g:[
 {id:'or_shop',name:'골목 끝 해질녘 문구점',ic:'🏮',ds:'‘이상한 과자 가게’처럼 신기한 가게 이야기 · 스스로 푸는 힘',pages:[
  ['🏫🎒👧','초등학교 3학년 지우는 수학 시간이 제일 싫었어요. 숫자만 보면 머릿속이 하얀 도화지처럼 텅 비어 버렸거든요.'],
  ['📝😩🔴','“내일은 곱셈 단원평가가 있어요.” 선생님 말씀에 지우는 책상에 이마를 콩 박았어요. 지난번 시험지에는 빨간 비가 주룩주룩 내렸었지요.'],
  ['🌆🐈‍⬛🏮','집으로 가는 길, 검은 고양이 한 마리가 지우 앞을 스윽 지나갔어요. 고양이를 따라 처음 보는 좁은 골목으로 들어서자, 붉은 등불이 걸린 작은 가게가 나타났어요.'],
  ['🏮📚✨','간판에는 ‘해질녘 문구점’이라고 쓰여 있었어요. 가게 안 선반에는 처음 보는 물건들이 가득했어요. 혼자 줄을 맞추는 공책, 콧노래를 부르는 필통, 빙글빙글 저절로 도는 지구본까지요.'],
  ['👵🐈‍⬛💬','“어서 오렴. 오늘 너에게 꼭 필요한 물건이 있을 거야.” 고양이처럼 금빛 눈동자를 가진 주인 할머니가 말했어요.'],
  ['✏️🌟🪙','할머니가 꺼낸 건 별무늬가 새겨진 연필이었어요. “이건 ‘척척 연필’이란다. 문제 위에 올려놓기만 하면 답을 척척 써 주지. 값은 네 주머니 속 동전 하나면 돼.”'],
  ['📜⚠️👵','“하지만 약속이 두 가지 있어. 하루에 딱 한 번만 쓸 것. 그리고 연필이 쓴 답은 반드시 네 손으로 다시 풀어 볼 것. 약속을 어기면 연필은 금세 닳아 버린단다.”'],
  ['🏠✏️😲','집에 온 지우는 숙제 위에 연필을 올려 보았어요. 사각사각! 연필이 저 혼자 움직이더니 7×8=56, 6×9=54… 답을 순식간에 써 내려갔어요.'],
  ['😆📒✔️','“우와, 대박!” 지우는 신이 나서 약속 같은 건 까맣게 잊어버렸어요. 수학 익힘책도, 학습지도, 받아쓰기 연습도 모두 척척 연필에게 맡겼어요.'],
  ['✏️📉😨','그런데 이상한 일이 생겼어요. 연필이 한 번 움직일 때마다 키가 쑥쑥 줄어드는 거예요. 사흘 만에 연필은 손가락 한 마디만큼 짧아졌어요.'],
  ['🏫📝⏰','드디어 단원평가 날이 되었어요. 지우는 몰래 필통에서 척척 연필을 꺼내 시험지 위에 올렸어요. 그런데 연필은 한 글자를 쓰다가 톡, 하고 부러져 버렸어요.'],
  ['😰❓🔢','시험지에는 ‘8×7=?’이라는 문제가 덩그러니 남아 있었어요. 연필이 수십 번이나 쓴 문제인데, 지우의 머릿속에는 아무것도 떠오르지 않았어요.'],
  ['🧠✋💭','지우는 눈을 감고 손가락을 하나씩 접어 보았어요. ‘8이 일곱 번… 8, 16, 24, 32, 40, 48, 56!’ 땀을 뻘뻘 흘리며 겨우 한 문제를 풀었어요.'],
  ['📄😓🚶‍♀️','결국 지우는 반도 풀지 못한 채 시험지를 냈어요. 집에 오는 길 내내 발걸음이 돌덩이처럼 무거웠어요.'],
  ['🌆🏮🐈‍⬛','그날 저녁, 지우는 부러진 연필을 들고 다시 골목을 찾아갔어요. 붉은 등불 아래에서 검은 고양이가 기다렸다는 듯 “야옹” 하고 울었어요.'],
  ['👧😢👵','“할머니, 약속을 안 지켜서 연필이 부러졌어요. 연필이 다 풀어 줬는데, 저는 하나도 모르겠어요.” 지우는 울먹이며 고개를 숙였어요.'],
  ['👵🧽✨','할머니는 빙그레 웃으며 평범해 보이는 지우개 하나를 내밀었어요. “이건 ‘다시 지우개’란다. 틀린 답을 지우면 다시 풀 용기가 생기지. 이 지우개는 절대 닳지 않아.”'],
  ['🧽📝🔁','지우는 집에 돌아와 단원평가 문제를 공책에 다시 옮겨 적었어요. 틀리면 지우고, 또 풀고, 또 지웠어요. 손은 아팠지만 이상하게 마음은 가벼웠어요.'],
  ['📅✏️📈','지우는 날마다 구구단을 열 줄씩 써 보았어요. 처음엔 5분이 넘게 걸리던 문제가 4분, 3분… 조금씩 빨라졌어요. 스스로 푼 답은 머릿속에 단단히 남았어요.'],
  ['📝💯🎉','한 달 뒤 다시 본 단원평가에서 지우는 처음으로 모든 문제를 끝까지 풀었어요. 시험지에 동그라미가 해님처럼 활짝 피었어요.'],
  ['🌆❓🐈‍⬛','기쁜 소식을 전하려 골목을 찾아갔지만, 해질녘 문구점은 감쪽같이 사라지고 없었어요. 담벼락 위에서 검은 고양이만 꼬리를 살랑 흔들 뿐이었어요.'],
  ['🧽💛👧','지우의 필통에는 지금도 다시 지우개가 들어 있어요. 틀려도 괜찮아요. 지우고 다시 풀면, 그 답은 영원히 내 것이 되니까요.']],
  quiz:[['척척 연필의 약속으로 알맞은 것은?','연필이 쓴 답을 스스로 다시 풀어 보기',['매일 연필을 깎기','친구에게 빌려주기'],'✏️'],['약속을 어기자 연필은 어떻게 되었나요?','점점 짧아지다가 부러졌어요',['더 길어졌어요','색이 바뀌었어요'],'📉'],['8 × 7은 얼마인가요?','56',['54','48'],'🔢'],['할머니가 두 번째로 준 물건은?','다시 지우개',['척척 공책','마법 필통'],'🧽'],['이 이야기가 알려 주는 것은?','스스로 풀고 다시 고쳐야 진짜 실력이 돼요',['신기한 물건이 있으면 공부를 안 해도 돼요','시험은 중요하지 않아요'],'💛']]},
 {id:'or_hanja',name:'한자 마법 학교의 비밀',ic:'🀄',ds:'‘마법천자문’처럼 한자 모험 · 日 月 山 水 火 木 人 大',pages:[
  ['🏰☁️🧒','구름 위에 떠 있는 한자 마법 학교에 서준이가 처음 입학하던 날이었어요. 이 학교에서는 한자의 뜻과 소리를 정확히 외쳐야만 마법이 일어난대요.'],
  ['🧙‍♂️🖌️✨','교장 선생님이 커다란 붓으로 허공에 글자를 썼어요. “한자는 그림에서 태어난 글자란다. 모양을 잘 보면 뜻이 보이지.”'],
  ['☀️日🧒','첫 수업은 ‘날 일(日)’이었어요. 동그란 해를 네모나게 그리고 가운데 점을 찍은 모양이래요. “날 일!” 서준이가 외치자 교실에 따뜻한 햇살이 쏟아졌어요.'],
  ['🌙月👧','짝꿍 하나는 ‘달 월(月)’을 배웠어요. 초승달 모양이 변해서 된 글자예요. “달 월!” 하나의 손끝에서 은은한 달빛이 퍼졌어요.'],
  ['⛈️👿🏰','그런데 그날 밤, 먹구름 마왕이 학교를 덮쳤어요. 마왕은 커다란 자루를 벌려 학교의 한자들을 몽땅 빨아들이고 사라졌어요.'],
  ['📚❌😱','다음 날 아침, 책마다 글자가 텅 비어 있었어요. 글자가 사라지자 마법도 힘을 잃었고, 학교는 구름 아래로 조금씩 가라앉기 시작했어요.'],
  ['🧒👧🗺️','“우리가 글자를 되찾아 오자!” 서준이와 하나는 교장 선생님께 받은 지도 한 장을 들고 마왕의 성으로 길을 나섰어요.'],
  ['⛰️山🧒','첫 번째 관문에서 거센 바람이 불어와 두 아이를 날려 버릴 것 같았어요. 서준이가 봉우리 세 개를 떠올리며 외쳤어요. “뫼 산(山)!” 땅에서 산이 솟아 바람을 막아 주었어요.'],
  ['🔥🏘️水','두 번째 관문은 불길이 활활 타오르는 마을이었어요. 하나는 흐르는 물줄기 모양을 떠올렸어요. “물 수(水)!” 하늘에서 시원한 비가 쏴아 쏟아져 불을 껐어요.'],
  ['🏘️🍙😊','마을 사람들은 고맙다며 주먹밥을 싸 주었어요. “마왕의 성은 깊은 동굴 너머에 있단다. 조심하렴.”'],
  ['🕳️火🧒','동굴 속은 한 치 앞도 보이지 않을 만큼 깜깜했어요. 서준이는 타오르는 불꽃 모양을 손가락으로 그렸어요. “불 화(火)!” 손바닥 위에 작은 불꽃이 피어올라 길을 밝혔어요.'],
  ['🌊🧒👧','동굴 끝에는 깊은 강이 가로막고 있었어요. 다리도 배도 없었어요. 하나가 곰곰이 생각하다 땅에 뿌리 내린 나무 모양을 그렸어요.'],
  ['🌳木🌉','“나무 목(木)!” 강가의 나무가 쑥쑥 자라 강 건너편까지 쓰러지며 튼튼한 나무다리가 되었어요.'],
  ['🏯👿⚡','드디어 마왕의 성에 도착했어요. 먹구름 마왕이 천둥 같은 목소리로 외쳤어요. “꼬마들 따위가 감히! 내 먹구름으로 모두 덮어 주마!”'],
  ['☁️🌑😨','먹구름이 몰려와 하늘을 새까맣게 덮었어요. 서준이가 “날 일!”을 외쳐도 햇살은 금세 먹구름에 가려졌어요.'],
  ['🧒🤝👧','“혼자서는 안 돼. 같이 하자!” 서준이와 하나는 손을 맞잡았어요. 그리고 두 팔과 두 다리를 벌린 사람 모양을 떠올렸어요.'],
  ['人大✨','“사람 인(人)!” 그리고 두 팔을 활짝 벌리며 “큰 대(大)!” 두 사람의 마법이 하나로 합쳐지자 커다란 빛이 성을 감쌌어요.'],
  ['☀️🌙🌟','이어서 “날 일! 달 월!” 해와 달의 빛이 함께 쏟아지자 먹구름이 스르르 걷혔어요. 마왕의 자루가 터지며 글자들이 반딧불처럼 날아올랐어요.'],
  ['👿😢☁️','작아진 마왕이 훌쩍였어요. “나도… 글자를 배우고 싶었어. 아무도 나에게 가르쳐 주지 않았어.”'],
  ['🧒📖👿','서준이는 마왕에게 손을 내밀었어요. “그럼 우리 학교에 와. 한자는 모양을 보면 뜻이 보여. 우리가 알려 줄게!”'],
  ['🏰☁️🎉','글자들이 돌아오자 학교는 다시 구름 위로 두둥실 떠올랐어요. 교실 맨 뒷자리에는 작은 먹구름 하나가 새 학생으로 앉아 있었어요.'],
  ['日月山水火木人大','오늘 배운 여덟 글자를 함께 외쳐 볼까요? 날 일, 달 월, 뫼 산, 물 수, 불 화, 나무 목, 사람 인, 큰 대! 여러분도 이제 한자 마법사예요.']],
  quiz:[['‘뫼 산(山)’은 무엇의 모양에서 왔나요?','산봉우리',['흐르는 물','사람'],'⛰️'],['불타는 마을을 구한 한자는?','물 수(水)',['불 화(火)','날 일(日)'],'🔥'],['강을 건너는 다리를 만든 한자는?','나무 목(木)',['뫼 산(山)','달 월(月)'],'🌉'],['‘큰 대(大)’는 어떤 모양에서 왔나요?','두 팔과 다리를 벌린 사람',['커다란 나무','둥근 해'],'🧍'],['마왕이 글자를 훔친 진짜 까닭은?','글자를 배우고 싶었지만 아무도 가르쳐 주지 않아서',['학교가 미워서','보물을 갖고 싶어서'],'👿']]},

/* ============ 2026-10 강화: 그림 장면 · 창작 그림책 · 구몬식 완성 · 오늘의 학습 · 새 게임 ============ */
/* ---- 동화 장면 그림 (글 내용에 맞춰 배경을 그려요) ---- */
const SCN=[['night',/밤|달님|달빛|별빛|별이|잠들|잠이|자장|깜깜|어두|꿈속|촛불/],['sea',/바다|파도|물고기|고래|배를|배가|강물|강이|강가|연못|냇물|물속|헤엄/],['snow',/눈이 |눈사람|겨울|눈송이|하얀 눈/],['rain',/비가|빗방울|우산|장마|비를/],['sky',/하늘|구름|날아|훨훨|무지개|풍선/],['forest',/숲|나무|산속|산에|산을|산이|꽃밭|들판|풀밭|오솔길|동굴/],['town',/마을|골목|길을|시장|장에|놀이터|도시|정류장/],['room',/방 안|방에|집 안|집에|부엌|교실|학교|거실|문구점|가게|침대|책상|마트|소파/]];
const sceneKind=t=>{for(const [k,re] of SCN)if(re.test(t))return k;return 'day'};
function sceneBG(kind,seed){
 let h=7;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;const rnd=()=>{h=(Math.imul(h,1103515245)+12345)>>>0;return h/4294967296};
 let sky=['#BDE3FF','#F3FAFF'],g='';
 const cloud=(x,y,s,c='#fff')=>`<g class="drift" style="animation-delay:-${(rnd()*10).toFixed(1)}s"><g transform="translate(${x} ${y}) scale(${s})" fill="${c}"><ellipse rx="52" ry="26"/><ellipse cx="38" cy="-14" rx="36" ry="28"/><ellipse cx="-34" cy="-8" rx="30" ry="22"/></g></g>`;
 const hills=(a,b)=>`<path d="M0 290 Q200 215 420 285 T800 262 V400 H0Z" fill="${a}"/><path d="M0 335 Q260 288 520 330 T800 318 V400 H0Z" fill="${b}"/>`;
 const sun=`<circle cx="690" cy="76" r="62" fill="#FFE98A" opacity=".5"/><circle cx="690" cy="76" r="44" fill="#FFD43B"/>`;
 const flowers=n=>Array.from({length:n},()=>{const x=rnd()*800,y=335+rnd()*55,c=['#FF7B69','#FFC531','#fff','#C9A8FF'][Math.floor(rnd()*4)];return `<circle cx="${x}" cy="${y}" r="7" fill="${c}"/><circle cx="${x}" cy="${y}" r="2.6" fill="#F59F00"/>`}).join('');
 const stars=n=>Array.from({length:n},()=>`<circle class="tw" cx="${(rnd()*800).toFixed(0)}" cy="${(rnd()*240).toFixed(0)}" r="${(1+rnd()*2.4).toFixed(1)}" fill="#FFF7C2" style="animation-delay:${(rnd()*3).toFixed(1)}s"/>`).join('');
 const tree=(x,y,s)=>rnd()<.5?`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-8" y="-10" width="16" height="50" rx="4" fill="#9A6B43"/><circle cy="-40" r="42" fill="#4FB35A"/><circle cx="-22" cy="-22" r="26" fill="#5CC066"/><circle cx="20" cy="-58" r="20" fill="#6FCF79"/></g>`:`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-7" y="-6" width="14" height="40" fill="#8B5E3C"/><polygon points="0,-110 -48,-4 48,-4" fill="#2F9E59"/><polygon points="0,-130 -34,-54 34,-54" fill="#40B36B"/></g>`;
 const waves=(y,c,o)=>{let d=`M-100 ${y}`;for(let i=0;i<22;i++)d+=' q25 -12 50 0';return `<path class="wave" d="${d}" stroke="${c}" stroke-width="5" fill="none" opacity="${o}"/>`};
 switch(kind){
  case 'night':sky=['#141D45','#3B4E94'];g=stars(46)+`<circle cx="660" cy="86" r="64" fill="#FFF3B0" opacity=".18"/><circle cx="660" cy="86" r="44" fill="#FFF3B0"/><circle cx="645" cy="74" r="8" fill="#F1E08F"/><circle cx="674" cy="102" r="6" fill="#F1E08F"/>`+cloud(200,120,.8,'#5B6BA8')+hills('#2C3B73','#1C2752');break;
  case 'sea':sky=['#9ED8FF','#E8F7FF'];g=sun+cloud(190,90,.9)+cloud(470,60,.7)+`<rect y="228" width="800" height="172" fill="#3EA6E0"/><rect y="228" width="800" height="40" fill="#5BBDF0"/>`+waves(258,'#fff',.7)+waves(300,'#BDE7FF',.6)+waves(340,'#fff',.4)+`<path d="M0 368 Q400 336 800 372 V400 H0Z" fill="#F6DFA4"/>`;break;
  case 'snow':sky=['#C7DCF2','#F4F9FF'];g=cloud(150,80,1,'#EEF3FA')+cloud(560,60,1.2,'#EEF3FA')+hills('#FFFFFF','#E6EFFA')+Array.from({length:44},()=>`<circle class="sfall" cx="${(rnd()*800).toFixed(0)}" cy="${(rnd()*380).toFixed(0)}" r="${(2+rnd()*4).toFixed(1)}" fill="#fff" style="animation-delay:-${(rnd()*6).toFixed(1)}s"/>`).join('');break;
  case 'rain':sky=['#8FA3B8','#D5DEE8'];g=cloud(200,70,1.5,'#B3BFCC')+cloud(570,58,1.7,'#A9B6C4')+hills('#7FB27A','#6AA266')+Array.from({length:60},()=>{const x=(rnd()*800).toFixed(0),y=(rnd()*330).toFixed(0);return `<line class="srain" x1="${x}" y1="${y}" x2="${x-6}" y2="${+y+22}" stroke="#E8F2FF" stroke-width="3" stroke-linecap="round" style="animation-delay:-${rnd().toFixed(2)}s"/>`}).join('');break;
  case 'sky':sky=['#86C8FF','#E6F5FF'];g=['#FF6B6B','#FFA94D','#FFE066','#69DB7C','#4DABF7','#9775FA'].map((c,i)=>`<path d="M${120+i*14} 420 A${280-i*14} ${280-i*14} 0 0 1 ${680-i*14} 420" stroke="${c}" stroke-width="14" fill="none" opacity=".75"/>`).join('')+cloud(150,110,1.1)+cloud(420,60,.8)+cloud(650,150,1.2)+cloud(300,250,.9)+cloud(720,300,.7);break;
  case 'forest':sky=['#BDE7FF','#F2FBFF'];g=sun+cloud(250,80,.8)+hills('#8FD18A','#6CBF6A')+[60,170,290,520,640,750].map((x,i)=>tree(x,300+(i%2)*14,.9+rnd()*.4)).join('')+flowers(8);break;
  case 'room':sky=['#FFF1DB','#FFE7C7'];g=Array.from({length:30},(_,i)=>`<circle cx="${(i%10)*84+30}" cy="${Math.floor(i/10)*80+40}" r="5" fill="#FFD9A8"/>`).join('')+`<rect x="80" y="50" width="200" height="150" rx="10" fill="#B9E2FF" stroke="#C98B55" stroke-width="12"/><line x1="180" y1="50" x2="180" y2="200" stroke="#C98B55" stroke-width="8"/><line x1="80" y1="125" x2="280" y2="125" stroke="#C98B55" stroke-width="8"/><circle cx="240" cy="90" r="16" fill="#FFD43B"/><rect x="560" y="70" width="120" height="90" rx="6" fill="#fff" stroke="#E8A15B" stroke-width="8"/><path d="M575 145 l30 -40 l25 28 l18 -18 l22 30Z" fill="#7DD07A"/><rect y="300" width="800" height="100" fill="#E2B887"/>`+[0,1,2,3,4].map(i=>`<line x1="0" y1="${310+i*20}" x2="800" y2="${310+i*20}" stroke="#D2A473" stroke-width="2"/>`).join('')+`<ellipse cx="400" cy="372" rx="260" ry="26" fill="#F7A8B8" opacity=".85"/>`;break;
  case 'town':sky=['#AEDCFF','#EEF8FF'];g=sun+cloud(200,80,.9)+cloud(480,50,.7)+[[30,'#FF8A80','#C0504A'],[170,'#FFD166','#E07A2E'],[310,'#9ED8A0','#3E8E5A'],[450,'#B5A8FF','#6B57D6'],[590,'#FFB3D1','#D45B8C'],[700,'#8FD3F5','#2F86B8']].map(([x,w,r],i)=>{const hh=110+(i%3)*30;return `<rect x="${x}" y="${300-hh}" width="110" height="${hh}" fill="${w}"/><polygon points="${x-10},${300-hh} ${x+55},${240-hh} ${x+120},${300-hh}" fill="${r}"/><rect x="${x+20}" y="${320-hh}" width="24" height="24" fill="#fff"/><rect x="${x+66}" y="${320-hh}" width="24" height="24" fill="#fff"/><rect x="${x+42}" y="250" width="26" height="50" fill="#8B5E3C"/>`}).join('')+`<rect y="300" width="800" height="100" fill="#BFC7D1"/><rect y="340" width="800" height="8" fill="#fff" opacity=".7"/>`;break;
  default:g=sun+cloud(170,90,1)+cloud(450,60,.8)+hills('#A6E3A1','#7DD07A')+flowers(16);
 }
 return `<svg class="bg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs><rect width="800" height="400" fill="url(#skyg)"/>${g}</svg>`;
}
const graphemes=s=>{try{return [...new Intl.Segmenter('ko',{granularity:'grapheme'}).segment(s)].map(x=>x.segment).filter(x=>x.trim())}catch(e){return Array.from(s).filter(x=>x.trim())}};
const _storyView0=storyView;
storyView=function(){_storyView0();const a=curAct(),p=a.pages[S.page];const sc=stage.querySelector('.scene');if(!sc)return;
 const kind=sceneKind(a.lang==='en'?(p[2]||p[1]):p[1]);const gs=graphemes(p[0]);const sz=gs.length>5?.62:gs.length>3?.8:1;
 sc.className='scene art k-'+kind;
 sc.innerHTML=sceneBG(kind,a.id+S.page)+`<div class="actors">${a.ch?CHARS[a.ch].svg:''}${gs.map((x,i)=>`<span style="--d:-${(i*.6).toFixed(1)}s;--s:${(i===0?sz:sz*.86).toFixed(2)}">${x}</span>`).join('')}</div><span class="pg">${S.page+1} / ${a.pages.length}</span>`;

const todayStr=(o=0)=>{const d=new Date(Date.now()+o*864e5);return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`};
function dayPick(arr,salt){if(!arr||!arr.length)return null;let h=0;const s=todayStr()+salt+kid().id+kid().level;for(const c of s)h=(Math.imul(h,31)+c.charCodeAt(0))>>>0;return arr[h%arr.length]}
function launch(sid,aid){S.subj=sid;S.act=aid;S.storyQuiz=false;const a=curAct();if(!a)return;

 const m=actsOf(lv,'math'),dr=m.filter(a=>a.type==='drill');
 const md=dr.find(a=>!(mast[`${lv}.math.${a.id}`]||{}).done);

 const ko=dayPick(actsOf(lv,'kor').filter(a=>a.type==='quiz'),'k');if(ko)T.push(['kor',ko.id,GR(lv)?'국어 문해력':'한글 익히기']);

function ensureToday(k){const d=todayStr();if(!k.today||k.today.d!==d||k.today.lv!==k.level)k.today={d,lv:k.level,done:[],bonus:false,tasks:genTasks(k)};return k.today}
function markToday(key){const k=kid();if(!k)return;const t=ensureToday(k),d=t.d;
 if(k.streakLast!==d){k.streak=k.streakLast===todayStr(-1)?(k.streak||0)+1:1;k.streakLast=d}
 if(!t.done.includes(key))t.done.push(key);
 if(!t.bonus&&t.tasks.length&&t.tasks.every(([s,id])=>t.done.includes(`${k.level}.${s}.${id}`))){t.bonus=true;k.stars+=5}}
function todayBanner(k){const t=ensureToday(k);const all=[];
 const rows=t.tasks.map(([s,id,lab],i)=>{const a=actsOf(k.level,s).find(x=>x.id===id);if(!a)return '';const ok=t.done.includes(`${k.level}.${s}.${id}`);all.push(ok);
  return `<button class="task ${ok?'done':''}" type="button" data-ti="${i}"><span class="ti">${ok?'✅':a.ic}</span><span>${a.name}<small>${lab}${ok?' · 완료':''}</small></span></button>`}).join('');
 const n=all.filter(Boolean).length,streak=(k.streakLast===t.d||k.streakLast===todayStr(-1))?(k.streak||0):0;
 return `<div class="today"><h3><span>📅 오늘의 학습 ${n} / ${all.length}</span><span class="streak">🔥 연속 ${streak}일째</span></h3><div class="tasks">${rows}</div>${n===all.length&&n?`<p class="tdone">🎉 오늘 공부를 모두 마쳤어요! 보너스 별 5개를 받았어요.</p>`:'<p>매일 같은 시간에 조금씩! 네 가지를 모두 끝내면 보너스 별 ⭐5개를 받아요.</p>'}</div>`}

/* ---- 구몬식 연산 완성 : 표준 완성 시간 + A 3번 연속이면 다음 단계 ---- */
const DSTD={dadd10:4,dsub10:4,dadd18:5,dsub18:5,dadd2:8,dsub2:9,dmul:4,dadd3:11,dsub3:13,dmul21:10,ddiv:5,dmul32:28,ddiv2:22,ddecadd:12,dmixed:16,ddecmul:13,ddecdiv:13,dpct:10};
const _finishDrill1=finishDrill;
finishDrill=function(){const dr=S.dr,k=kid(),key=actKey(),a=curAct(),t=Date.now()-dr.t0;
 const std=Math.round((DSTD[a.id]||8)*dr.list.length*(GR(k.level)?1:1.6))*1000,acc=dr.ok/dr.list.length;
 const grade=acc===1&&t<=std?'A':acc>=.9&&t<=std*1.3?'B':acc>=.7?'C':'D';
 k.mast=k.mast||{};const m=k.mast[key]=k.mast[key]||{a:0,runs:0,done:false};m.runs++;
 if(grade==='A')m.a++;else m.a=0;const just=!m.done&&m.a>=3;if(m.a>=3)m.done=true;
 S.mast={grade,std,a:Math.min(m.a,3),done:m.done,just};markToday(key);_finishDrill1()};

 const ds=curActs().filter(x=>x.type==='drill'),nx=ds[ds.findIndex(x=>x.id===a.id)+1];

 const html=`<div class="mast"><span class="grade g-${M.grade}">${M.grade}</span><div>${tip}<small>표준 완성 시간 ${mmss(M.std)} · 완성 진도 ${'●'.repeat(M.a)}${'○'.repeat(3-M.a)} (A를 3번 연속 받으면 완성)</small>${M.done?`<div>🏅 이 단계 완성!${nx?` 다음 단계는 <b>${nx.name}</b>`:''}</div>${nx?`<button class="lbtn on" type="button" id="nextLv">다음 단계 시작 →</button>`:''}`:''}</div></div>`;
 const rep=stage.querySelector('.report');if(rep)rep.insertAdjacentHTML('afterend',html);
 if(M.just)say('축하해요! 이 단계를 완성했어요.');

  $('#spk').onclick=()=>sayList([[m.w[0],'ko-KR']]);

  ['🌙🍈💤','그날 밤 아이들은 참외 배를 타는 꿈을 꾸었어요. 내년 여름에도 노란 배가 둥실 떠오르겠지요?']],
  quiz:[['커다랗게 자란 과일은 무엇인가요?','참외',['수박','사과'],'🍈'],['참외는 어디에 떠서 배가 되었나요?','시냇물',['하늘','수영장'],'🌊'],['소나기가 올 때 아이들은 무엇을 썼나요?','참외 껍질',['큰 나뭇잎','바가지'],'🌦️']]},
 {id:'bs_snail',book:'gwaenchana',name:'느려도 괜찮아, 달팽이 토리',ic:'🐌',ds:'‘괜찮아’ 느낌 · 누구에게나 잘하는 것이 있어요',pages:[
  ['🐌🌿😔','풀숲 마을에 달팽이 토리가 살았어요. 토리는 늘 한숨을 쉬었어요. “나는 너무 느려. 잘하는 게 하나도 없어.”'],
  ['🐇💨','토끼는 깡충깡충 빨리 달렸어요. “토리야, 나처럼 빨리 달려 봐!” 하지만 토리는 한 걸음 가는 데도 한참 걸렸어요.'],
  ['🐦🎵','참새는 짹짹 고운 노래를 불렀어요. 토리도 따라 불러 보았지만, 입에서는 아무 소리도 나오지 않았어요.'],
  ['🐿️🌰','다람쥐는 나무를 쪼르르 타고 올라갔어요. 토리는 미끄러져 데굴데굴 굴러떨어졌어요.'],
  ['🐌😢💧','토리는 집 속에 쏙 숨어 버렸어요. “나는 아무것도 못 하는 달팽이야.”'],
  ['🌧️⛈️😱','그날 오후, 갑자기 장대비가 쏟아졌어요. 친구들은 비를 피할 곳을 찾지 못해 발을 동동 굴렀어요.'],
  ['🐌🏠✨','토리가 집에서 고개를 내밀었어요. “내 집 옆 바위 밑으로 와! 거기는 비가 안 들어와.” 토리는 비 오는 날 갈 곳을 잘 알았거든요.'],
  ['🐇🐦🐿️','친구들은 토리를 따라 바위 밑으로 모였어요. 젖은 몸이 금세 보송보송해졌어요.'],
  ['🐌👀🍃','비가 그치자 토리가 천천히 기어가며 말했어요. “여기 봐, 새싹이 났어. 저기는 무당벌레 알이 있어.” 느리게 걷는 토리는 작은 것들을 누구보다 잘 보았어요.'],
  ['🐇😮💬','토끼가 말했어요. “나는 빨리 달리느라 이런 걸 하나도 못 봤어. 토리야, 너는 정말 대단해!”'],
  ['🐌😊💛','토리는 처음으로 활짝 웃었어요. “느려도 괜찮아. 나는 천천히 보는 걸 잘하는 달팽이야.”'],
  ['🌈🐌🐇','여러분은 무엇을 잘하나요? 조금 느려도, 조금 서툴러도 괜찮아요. 누구에게나 반짝이는 좋은 점이 있으니까요.']],
  quiz:[['토리는 처음에 왜 속상했나요?','잘하는 게 없다고 생각해서',['집을 잃어버려서','배가 고파서'],'🐌'],['비가 올 때 토리는 친구들을 어디로 데려갔나요?','바위 밑',['연못 속','나무 꼭대기'],'🌧️'],['토리가 잘하는 것은 무엇인가요?','천천히 작은 것까지 잘 보기',['빨리 달리기','노래 부르기'],'👀']]},
 {id:'bs_hotteok',book:'patbingsu',name:'호떡 할머니와 배고픈 도깨비',ic:'🥞',ds:'‘팥빙수의 전설’ 느낌 · 맛있는 음식의 탄생 이야기',pages:[
  ['🏔️👵🌾','눈이 펑펑 내리는 산골 마을에 떡을 잘 빚는 할머니가 살았어요. 할머니는 장에 가서 떡을 팔아 살았지요.'],
  ['👹🌙❄️','그런데 겨울밤마다 배고픈 도깨비가 찾아와 할머니의 떡을 몰래 집어 먹고 달아났어요. “떡 내놔, 아니면 장난칠 테다!”'],
  ['👵🤔💡','할머니는 곰곰이 생각했어요. ‘도깨비가 배가 고파서 그런 거라면, 혼내기보다 배불리 먹게 해 주자.’'],
  ['👵👹🍳','다음 날 밤, 할머니가 도깨비를 불렀어요. “도깨비야, 숨지 말고 이리 오너라. 같이 맛있는 걸 만들어 먹자.”'],
  ['🥣👹😳','도깨비는 머쓱하게 부엌으로 들어왔어요. 할머니는 밀가루 반죽을 조물조물 주무르는 법을 가르쳐 주었어요.'],
  ['🍯🥜👵','“반죽 속에 달콤한 꿀과 고소한 땅콩을 쏙 넣고, 동그랗게 오므리렴.” 도깨비는 커다란 손으로 조심조심 반죽을 빚었어요.'],
  ['🔥🍳😮','달군 솥뚜껑 위에 반죽을 올리고 꾹 눌렀더니, 치이익! 노릇노릇 고소한 냄새가 온 마을로 퍼졌어요.'],
  ['🥞😋👹','한 입 베어 물자 뜨거운 꿀이 주르륵 흘렀어요. “앗 뜨거! 그런데 너무 맛있다!” 도깨비가 펄쩍펄쩍 뛰었어요.'],
  ['🏘️👃👨‍👩‍👧','냄새를 맡은 마을 사람들이 하나둘 모여들었어요. 할머니와 도깨비는 호떡을 구워 모두에게 나누어 주었어요.'],
  ['👹🔥💪','도깨비는 이제 떡을 훔치지 않았어요. 대신 겨울마다 도깨비불로 솥뚜껑을 따끈하게 데워 주었지요.'],
  ['👵👹😊','“도깨비야, 고맙다. 네 덕분에 겨울이 따뜻하구나.” “할머니, 저도 고마워요. 배고플 때 화내지 않고 같이 먹으니 훨씬 좋아요.”'],
  ['❄️🥞✨','그래서 지금도 추운 겨울이면 길거리에서 따끈한 호떡을 굽는대요. 호떡 속 꿀처럼 달콤한 나눔의 맛이랍니다.']],
  quiz:[['도깨비는 왜 떡을 훔쳤나요?','배가 고파서',['할머니가 미워서','떡이 무서워서'],'👹'],['호떡 속에 넣은 것은?','꿀과 땅콩',['팥과 얼음','김치와 두부'],'🍯'],['할머니가 도깨비를 대한 방법은?','같이 음식을 만들어 나눠 먹었어요',['크게 혼내서 쫓아냈어요','문을 꼭 잠갔어요'],'👵']]},
 {id:'bs_train',book:'100floors',name:'열 칸 기차 동물 여행',ic:'🚂',ds:'‘100층짜리 집’ 느낌 · 1부터 10까지 세며 떠나는 여행',pages:[
  ['🎫👧✨','어느 날 아침, 하윤이 창문 틈으로 반짝이는 기차표 한 장이 날아왔어요. ‘열 칸 기차에 초대합니다. 맨 끝 칸까지 와 주세요!’'],
  ['🚂1️⃣🐭','1번 칸에는 생쥐 한 마리가 치즈를 먹고 있었어요. “어서 와! 다음 칸으로 가 봐.” 생쥐 하나, 치즈 하나.'],
  ['2️⃣🐰🐰','2번 칸에는 토끼 두 마리가 당근을 아삭아삭 먹고 있었어요. 토끼 둘, 당근 둘.'],
  ['3️⃣🐸🐸🐸','3번 칸은 연못 칸이었어요! 개구리 세 마리가 “개굴, 개굴, 개굴” 노래를 불렀어요.'],
  ['4️⃣🐧🐧','4번 칸은 꽁꽁 얼음 칸이었어요. 펭귄 네 마리가 미끄럼을 타며 놀았어요. 하나, 둘, 셋, 넷!'],
  ['5️⃣🐒🍌','5번 칸에는 원숭이 다섯 마리가 줄을 타고 휙휙 날아다녔어요. 바나나도 다섯 개가 대롱대롱.'],
  ['6️⃣7️⃣🐝🐞','6번 칸에는 꿀벌 여섯 마리가 붕붕, 7번 칸에는 무당벌레 일곱 마리가 꽃밭에서 놀고 있었어요.'],
  ['8️⃣🐙','8번 칸은 바닷속 칸! 다리가 여덟 개인 문어가 다리 하나하나로 하윤이에게 손을 흔들었어요.'],
  ['9️⃣🦉⭐','9번 칸은 밤하늘 칸이었어요. 부엉이 아홉 마리가 반짝이는 별을 세고 있었어요.'],
  ['🔟🐘🎉','드디어 마지막 10번 칸! 문을 열자 코끼리 아저씨가 외쳤어요. “깜짝 파티다!” 앞 칸의 동물 친구들이 모두 모여 있었어요.'],
  ['🎂🐭🐘','“생쥐 1, 토끼 2, 개구리 3 … 모두 합치면 몇 마리일까?” 하윤이는 손가락으로 차근차근 세어 보았어요.'],
  ['🚂🌅👧','기차는 노을 속을 칙칙폭폭 달렸어요. 하윤이는 오늘 1부터 10까지 숫자 친구들과 신나는 여행을 했어요.']],
  quiz:[['3번 칸에는 어떤 동물이 있었나요?','개구리',['펭귄','부엉이'],'🐸'],['다리가 여덟 개인 동물은?','문어',['원숭이','코끼리'],'🐙'],['토끼 2마리와 개구리 3마리를 더하면?','5마리',['4마리','6마리'],'➕'],['마지막 칸은 몇 번 칸이었나요?','10번',['9번','100번'],'🔟']]},
 {id:'bs_palette',book:'feelings',name:'기분 색깔 팔레트',ic:'🎨',ds:'‘기분을 말해 봐!’ 느낌 · 내 감정을 말로 표현해요',pages:[
  ['🎨👦✨','시우는 생일 선물로 마법 팔레트를 받았어요. 기분이 바뀔 때마다 팔레트의 색깔도 바뀌는 신기한 팔레트였어요.'],
  ['🌞💛😊','아침에 일어나니 햇살이 반짝였어요. 팔레트에 노란색이 퐁 생겼어요. “노란색은 기쁨! 오늘은 좋은 일이 생길 것 같아.”'],
  ['🥛😠❤️','그런데 동생이 시우 우유를 쏟았어요. 팔레트가 빨갛게 부글부글 끓었어요. “빨간색은 화남이구나.” 시우는 숨을 크게 쉬고 말했어요. “나 지금 화났어. 다음엔 조심해 줘.”'],
  ['🏫😟💜','학교에서 발표 차례가 다가오자 팔레트가 보라색으로 떨렸어요. “보라색은 걱정이야.” 선생님이 말했어요. “떨리는 건 당연해. 천천히 해도 돼.”'],
  ['🎤😄🧡','발표를 마치자 친구들이 박수를 쳤어요. 팔레트가 주황색으로 반짝였어요. “주황색은 뿌듯함! 내가 해냈어!”'],
  ['🐶😢💙','집에 오는 길, 이웃집 강아지가 이사를 간다는 소식을 들었어요. 팔레트가 파랗게 물들었어요. “파란색은 슬픔이야.”'],
  ['👩🤗💙','엄마가 시우를 꼭 안아 주었어요. “슬플 땐 울어도 괜찮아. 슬프다고 말해 줘서 고마워.” 엄마 품 안에서 파란색이 조금씩 옅어졌어요.'],
  ['🐶✉️💚','시우는 강아지에게 그림 편지를 써 주었어요. 팔레트에 초록색이 피어났어요. “초록색은 고마움이야. 그동안 같이 놀아 줘서 고마워.”'],
  ['🎨🌈👦','잠들기 전 팔레트를 보니 노랑, 빨강, 보라, 주황, 파랑, 초록이 모두 섞여 있었어요. “하루에 이렇게 많은 기분이 있었구나!”'],
  ['🖌️🖼️✨','시우는 오늘의 기분 색깔로 그림을 그렸어요. 여러 색이 모이니 세상에 하나뿐인 멋진 그림이 되었어요.'],
  ['👦💬💛','어떤 기분도 나쁜 기분은 없어요. 중요한 건 “나 지금 이런 기분이야.” 하고 말로 표현하는 거예요.'],
  ['❓🎨😊','여러분의 지금 기분은 무슨 색인가요? 오늘 하루의 기분을 색깔로 말해 보세요.']],
  quiz:[['노란색은 어떤 기분이었나요?','기쁨',['화남','슬픔'],'💛'],['동생이 우유를 쏟았을 때 시우는 어떻게 했나요?','숨을 쉬고 화난 마음을 말로 했어요',['동생을 밀었어요','팔레트를 던졌어요'],'🥛'],['슬플 때 좋은 방법은?','슬프다고 말하고 위로받기',['꾹 참고 숨기기','친구에게 화내기'],'💙']]},
 {id:'bs_tooth',book:'dentist',name:'충치 괴물과 반짝 칫솔',ic:'🦷',ds:'‘이가 아파서 치과에 가요’ 느낌 · 치과는 무섭지 않아요',pages:[
  ['🍭🍫👦','유찬이는 사탕과 초콜릿을 제일 좋아했어요. 그리고 양치질은 제일 싫어했어요. “조금만 대충 닦아도 괜찮겠지?”'],
  ['🦷👾😈','유찬이가 잠든 밤, 어금니 사이에서 작은 충치 괴물들이 꼬물꼬물 나타났어요. “냠냠, 단 거 찌꺼기다! 여기에 구멍을 파자!”'],
  ['😖🦷💥','며칠 뒤, 사과를 먹던 유찬이가 “아야!” 하고 볼을 감쌌어요. 이가 욱신욱신 아파 왔어요.'],
  ['👩🏥😨','엄마가 말했어요. “치과에 가 보자.” 유찬이는 고개를 세차게 저었어요. “싫어요! 치과는 무서워요!”'],
  ['🧑‍⚕️😊🪥','치과 선생님은 웃으며 말했어요. “무서운 건 하나도 없어. 먼저 거울로 네 이를 같이 구경해 보자.”'],
  ['🪞🦷👀','작은 거울 속에 까만 점이 보였어요. “이게 바로 충치 괴물이 판 구멍이야. 단 음식 찌꺼기를 먹고 산단다.”'],
  ['💺💦🎵','의자가 위잉 하고 뒤로 눕고, 시원한 물이 칙칙 나왔어요. “조금 시끄러운 소리가 나지만, 아프면 왼손을 들면 돼.”'],
  ['🦷✨😮','선생님이 구멍을 깨끗이 청소하고 단단하게 메워 주었어요. 생각보다 금방 끝났어요. “벌써 끝났어요?”'],
  ['🧑‍⚕️🪥📏','“이제 충치 괴물이 다시 오지 못하게 이 닦는 법을 알려 줄게. 밥 먹고 3분, 위아래로 쓸어내리듯, 안쪽까지 구석구석!”'],
  ['👦🪥😁','그날 밤 유찬이는 거울 앞에서 꼼꼼하게 이를 닦았어요. 칫솔이 지나간 자리마다 이가 반짝반짝 빛났어요.'],
  ['👾😱💨','어금니 사이에 숨어 있던 충치 괴물들이 비명을 질렀어요. “으악, 반짝 칫솔이다! 도망가자!”'],
  ['🦷😊⭐','유찬이는 이제 치과가 무섭지 않아요. 단 것을 먹은 뒤에는 꼭 이를 닦고, 여섯 달마다 치과 선생님께 이를 보여 드린답니다.']],

 {id:'bs_firefly',book:'gingin',name:'마지막 반딧불이 별이',ic:'✨',ds:'‘긴긴밤’ 느낌 · 서로를 지켜 주며 떠나는 긴 여행',pages:[
  ['🌃🏙️✨','불빛이 꺼지지 않는 도시 한구석, 오래된 공원 풀숲에 반딧불이 별이가 살았어요. 별이는 이 공원에 남은 마지막 반딧불이였어요.'],
  ['✨😔🌫️','예전에는 밤마다 수백 마리 친구들이 함께 빛났대요. 하지만 개울이 마르고 가로등이 밝아지면서 친구들은 하나둘 사라졌어요.'],
  ['🥚🐢❓','어느 밤, 별이는 말라 버린 개울가에서 작은 알 하나를 발견했어요. 알이 톡 깨지더니 아기 남생이가 고개를 내밀었어요.'],
  ['🐢👀✨','“엄마?” 아기 남생이는 별이를 보고 말했어요. 별이는 당황했지만, 작은 불빛을 깜빡이며 대답했어요. “나는 엄마는 아니지만… 네 곁에 있어 줄게.”'],
  ['🐢✨🗺️','별이는 아기 남생이에게 ‘콩이’라는 이름을 지어 주었어요. 그리고 할머니 반딧불이에게 들었던 이야기를 떠올렸어요. “강을 따라 내려가면 맑은 물이 흐르는 습지가 있대.”'],
  ['🌙🛣️✨','둘은 긴 여행을 시작했어요. 별이는 밤마다 앞에서 길을 밝혔고, 콩이는 느리지만 꿋꿋하게 한 걸음씩 따라왔어요.'],
  ['🚗💡😱','큰길을 건널 때 자동차 불빛이 번쩍였어요. 콩이는 겁에 질려 등딱지 속에 숨었어요. 별이는 콩이 머리 위에서 계속 깜빡였어요. “내 불빛만 봐. 천천히, 천천히.”'],
  ['🌧️🍂🐢','비 오는 밤에는 콩이가 나뭇잎 우산을 들어 별이를 지켜 주었어요. 빛이 약해진 별이는 콩이 등딱지 위에서 쉬었어요.'],
  ['🦉🌳💬','숲에서 만난 늙은 부엉이가 말했어요. “습지는 아직 있지. 하지만 사람들이 그곳을 지키느라 애쓰고 있단다. 너희처럼 서로를 지키면서 말이야.”'],
  ['✨📉😟','여행이 길어질수록 별이의 빛은 점점 희미해졌어요. 반딧불이가 빛날 수 있는 시간은 그리 길지 않았거든요.'],
  ['🐢💧😢','“별이야, 힘내. 조금만 더 가면 돼.” 이번에는 콩이가 별이를 등에 태우고 걸었어요. 느린 걸음이었지만 한 번도 멈추지 않았어요.'],
  ['🌾🌊✨','드디어 새벽이 오기 직전, 갈대가 흔들리는 맑은 습지에 도착했어요. 그리고 그곳에서 수많은 반딧불이가 일제히 빛나기 시작했어요.'],
  ['✨✨✨','“별이야, 봐! 네 친구들이야!” 별이는 마지막 힘을 내어 반짝, 하고 가장 밝게 빛났어요. 습지의 반딧불이들이 별이를 둘러싸고 함께 빛났어요.'],
  ['🐢🌅💛','“콩이야, 여기서 살아. 맑은 물이 있고 친구들이 있어.” 별이의 빛은 아침 햇살 속으로 조용히 스며들었어요.'],
  ['🐢🌿🌙','콩이는 습지에서 무럭무럭 자랐어요. 그리고 밤이 오면 늘 반딧불이들을 바라보며 별이를 떠올렸어요.'],
  ['🐢🧒✨','오랜 시간이 지나 커다란 남생이가 된 콩이는 습지를 찾아온 아이들에게 이야기해 주어요. “누군가 나를 위해 빛나 주었기에, 나는 여기까지 올 수 있었단다.”']],
  quiz:[['별이는 공원에서 어떤 존재였나요?','마지막 남은 반딧불이',['가장 큰 반딧불이','반딧불이 대장'],'✨'],['반딧불이가 사라진 까닭으로 알맞은 것은?','개울이 마르고 불빛이 너무 밝아져서',['겨울이 너무 추워서','친구들이 이사를 가서'],'🌫️'],['별이가 지쳤을 때 콩이는 어떻게 했나요?','별이를 등에 태우고 걸었어요',['혼자 먼저 갔어요','집으로 돌아갔어요'],'🐢'],['이 이야기가 전하는 마음은?','서로를 지켜 주는 사랑과 자연을 지키는 마음',['혼자가 가장 편하다는 마음','빨리 가는 것이 최고라는 마음'],'💛']]},
 {id:'bs_market',book:'monster',name:'보름달 도깨비 시장',ic:'🏮',ds:'‘몬스터 캠핑장’ 느낌 · 보름달 밤에만 열리는 신비한 시장',pages:[
  ['🌕🏘️👦','한 달에 딱 한 번, 보름달이 뜨는 밤이면 뒷산 고개 너머에 도깨비 시장이 열린다는 소문이 있었어요. 4학년 태오는 그 소문을 믿지 않았어요.'],
  ['🐕🌕🏮','그런데 보름달 밤, 강아지 보리가 뒷산으로 달려가 버렸어요. 보리를 쫓아 고개를 넘자, 수백 개의 초롱불이 반짝이는 시장이 눈앞에 펼쳐졌어요.'],
  ['👹👺🏮','외뿔 도깨비, 긴 목 도깨비, 털북숭이 도깨비가 북적북적 물건을 사고팔고 있었어요. 그런데 아무도 돈을 내지 않았어요.'],
  ['👺💬📖','“여기선 돈 대신 이야기로 값을 치른단다.” 긴 목 도깨비가 웃었어요. “재미있는 이야기 하나면 신발 한 켤레, 감동적인 이야기면 빛나는 구슬 하나!”'],
  ['🐕🦴👹','보리는 털북숭이 도깨비 가게 앞에서 꼬리를 흔들고 있었어요. “이 강아지가 내 뼈다귀를 먹었으니, 이야기 세 개를 내야 데려갈 수 있지!”'],
  ['👦😰💭','태오는 당황했어요. 이야기라니, 무슨 이야기를 해야 하지? 그때 할머니가 들려주던 옛날이야기가 떠올랐어요.'],
  ['👦🗣️🐯','“옛날 옛적, 호랑이가 곶감을 제일 무서워했대요…” 태오가 실감 나게 이야기하자 도깨비들이 하나둘 모여들었어요. “하하하, 곶감이 뭐가 무섭다고!”'],
  ['👦🗣️🏫','두 번째는 태오가 학교에서 실수로 선생님을 ‘엄마’라고 부른 이야기였어요. 도깨비들이 배를 잡고 데굴데굴 굴렀어요.'],
  ['👦😔🗣️','세 번째 이야기를 하려는데 태오의 목소리가 작아졌어요. “사실 저는 이사 와서 아직 친구가 없어요. 보리만 제 친구예요.”'],
  ['👹😢💛','시장이 조용해졌어요. 털북숭이 도깨비가 코를 훌쩍였어요. “나도 처음 이 시장에 왔을 때 친구가 하나도 없었단다.”'],
  ['👹🔮✨','도깨비는 보리를 돌려주며 빛나는 구슬 하나를 덤으로 건넸어요. “솔직한 이야기는 가장 비싼 이야기란다. 이건 용기 구슬이야.”'],
  ['👦🏮🎶','태오는 시장을 구경했어요. 거꾸로 흐르는 모래시계, 웃음소리를 담은 병, 꿈을 그려 주는 붓… 하지만 가장 재미있는 건 도깨비들의 이야기였어요.'],
  ['🌅🏮💨','닭이 우는 소리와 함께 초롱불이 하나둘 꺼지더니, 시장은 안개처럼 사라졌어요. 태오 손에는 용기 구슬만 남아 있었어요.'],
  ['🏫👦🗣️','다음 날, 태오는 구슬을 주머니에 넣고 쉬는 시간에 친구들에게 다가갔어요. “얘들아, 내가 정말 신기한 이야기 해 줄까?”'],
  ['👦👧👦😆','태오의 이야기에 친구들이 모여들었어요. 그날 이후 태오 주변에는 늘 이야기를 듣고 싶은 친구들이 북적였어요.'],
  ['🌕🔮😊','보름달이 뜨는 밤이면 태오는 창밖을 내다봐요. 고개 너머 어딘가에서, 도깨비들이 오늘도 이야기를 사고팔고 있을 테니까요.']],
  quiz:[['도깨비 시장은 언제 열리나요?','보름달이 뜨는 밤',['비가 오는 날','매주 일요일'],'🌕'],['도깨비 시장에서는 무엇으로 값을 치르나요?','이야기',['돈','사탕'],'📖'],['태오의 세 번째 이야기는 무엇이었나요?','친구가 없어 외롭다는 솔직한 이야기',['호랑이와 곶감 이야기','선생님을 엄마라고 부른 이야기'],'💛'],['도깨비가 준 구슬의 이름은?','용기 구슬',['소원 구슬','시간 구슬'],'🔮']]},
 {id:'bs_relay',book:'lane5',name:'마지막 바퀴의 약속',ic:'🏃',ds:'‘5번 레인’ 느낌 · 경쟁과 우정 속에서 자라는 마음',pages:[
